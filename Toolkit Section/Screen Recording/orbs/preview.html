<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Relay orbs — blinking, no background</title>
<style>
  body { margin: 0; font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; background: #111; color: #f4f5f4; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; margin: 0; padding: 18px 22px 4px; }
  p.sub { margin: 0; padding: 0 22px 14px; color: rgba(244,245,244,0.5); font-size: 12px; }
  .band { padding: 20px 22px; display: flex; gap: 26px; align-items: center; }
  .band + .band { border-top: 1px solid rgba(255,255,255,0.09); }
  .band .tag { width: 92px; flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; }
  .band img { width: 96px; height: 96px; }
  .band .small img { width: 52px; height: 52px; }
  .band .tiny img { width: 22px; height: 22px; }

  .on-dark  { background: #000; }
  .on-light { background: #f4f5f8; color: #181b2c; }
  .on-brand { background: #00ad6c; }
  .on-check {
    background-color: #808080;
    background-image:
      linear-gradient(45deg, #6b6b6b 25%, transparent 25%, transparent 75%, #6b6b6b 75%),
      linear-gradient(45deg, #6b6b6b 25%, transparent 25%, transparent 75%, #6b6b6b 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
  }
</style>
</head>
<body>
<h1>Relay agent orbs — blinking, transparent</h1>
<p class="sub">Same artwork, same 0.28s ease-in-out blink, same 900ms&nbsp;/&nbsp;p=0.22 schedule as the shelf in booth.html. 8.1s loop, each orb out of step with the others.</p>

<div class="band on-check"><span class="tag">checker</span>
  <img src="orb-cart-recovery.gif" alt="Cart Recovery">
  <img src="orb-payment-recovery.gif" alt="Payment Recovery">
  <img src="orb-emi-collection.gif" alt="EMI Collection">
</div>
<div class="band on-dark"><span class="tag">black</span>
  <img src="orb-cart-recovery.gif" alt="">
  <img src="orb-payment-recovery.gif" alt="">
  <img src="orb-emi-collection.gif" alt="">
</div>
<div class="band on-light"><span class="tag">light</span>
  <img src="orb-cart-recovery.gif" alt="">
  <img src="orb-payment-recovery.gif" alt="">
  <img src="orb-emi-collection.gif" alt="">
</div>
<div class="band on-brand"><span class="tag">brand</span>
  <img src="orb-cart-recovery.gif" alt="">
  <img src="orb-payment-recovery.gif" alt="">
  <img src="orb-emi-collection.gif" alt="">
</div>
<div class="band on-dark"><span class="tag">webp</span>
  <img src="orb-cart-recovery.webp" alt="">
  <img src="orb-payment-recovery.webp" alt="">
  <img src="orb-emi-collection.webp" alt="">
</div>
<div class="band on-dark"><span class="tag">shelf size</span>
  <span class="small"><img src="orb-cart-recovery.gif" alt=""></span>
  <span class="small"><img src="orb-payment-recovery.gif" alt=""></span>
  <span class="small"><img src="orb-emi-collection.gif" alt=""></span>
  <span class="tiny"><img src="orb-cart-recovery.gif" alt=""></span>
  <span class="tiny"><img src="orb-payment-recovery.gif" alt=""></span>
  <span class="tiny"><img src="orb-emi-collection.gif" alt=""></span>
</div>
</body>
</html>
