/* thread
 *
 * It scrolls, so a run can be read back. It used to be `overflow: hidden` with
 * `justify-content: flex-end`, which pinned the newest message to the bottom
 * and simply clipped everything above it -- there was no way to see what the
 * agent had said three beats ago.
 *
 * flex-end is the trap here: on a scrollable box it clips overflow at the TOP,
 * and no amount of scrollTop will reach it. So the bottom-pinning is done with
 * an auto top margin on the first message instead. Short thread: the margin
 * eats the slack and the bubbles sit on the composer, exactly as before. Long
 * thread: the margin resolves to zero and the box scrolls normally.
 */
.thread {
  position: relative; z-index: 2;
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 6px 16px 4px;
  display: flex; flex-direction: column; justify-content: flex-start; gap: 9px;
  scrollbar-width: thin; scrollbar-color: rgba(29, 34, 31, 0.2) transparent;
}
.thread > *:first-child { margin-top: auto; }
/* thin enough to read as part of the phone rather than as browser chrome */
.thread::-webkit-scrollbar { width: 5px; }
.thread::-webkit-scrollbar-track { background: transparent; }
.thread::-webkit-scrollbar-thumb { background: rgba(29, 34, 31, 0.2); border-radius: 3px; }

/* ----------------------------------------------------------------------
 * The home tiles, rebuilt to the Figma index frame.
 *
 * Three products, three tiles, nothing else. The earlier grid carried nine
 * more that were locked "Live product" cards -- scenery you cannot tap, which
 * on a tap-through prototype trains the viewer that most of the screen is
 * dead. Everything on this grid now opens.
 *
 * The card language is the reference's, not the old bento's: a pure black
 * card, a white line glyph, a two-weight wordmark that wraps under itself,
 * and vivid art bleeding off the right edge.
 * The art is each product's own corner render, inlined so the section still
 * ships as one self-contained file with nothing beside it to load.
 * -------------------------------------------------------------------- */

.hgrid { display: flex; flex-direction: column; gap: 10px; }

.hcard {
  position: relative; overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 21px;
  background: #000;
  padding: 15px 16px 14px;
  min-height: 168px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease;
}
.hcard:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.16); }

/* icon and wordmark share a line; the wordmark wraps under itself, not under
   the glyph, which is what gives the reference its stacked look */
/* 58% is where the art's leading edge lands: the wordmark wraps under itself
   rather than running behind a solid render, which is what the drawn blobs
   used to forgive. */
.hlock { position: relative; z-index: 3; display: flex; align-items: flex-start; gap: 11px; min-width: 0; max-width: 58%; }
.hlock .hg { flex: none; width: 27px; height: 27px; color: #fff; margin-top: -1px; }
.hlock .hg svg { width: 100%; height: 100%; display: block; }
/* Relay is the one product on this grid with a real logo rather than a drawn
   glyph, so its card carries the mark itself (from ../black -Logo.svg). It runs
   a little past the 27px box because it is two thin strokes on a wide footprint
   rather than one solid square shape, and it keeps its own gradients instead of
   inheriting the white the other glyphs are stroked in. */
.hlock .hg svg.relaymark { width: 118%; height: 118%; margin: -9% 0 0 -6%; }
.hlock .name {
  font-size: 22px; font-weight: 800; letter-spacing: -0.035em; color: #fff;
  line-height: 1.14; min-width: 0; overflow-wrap: anywhere;
}
.hlock .name .thin { font-weight: 300; color: rgba(255, 255, 255, 0.9); }

/* ---- the art: the real corner renders, dropped into the card's corner ----
 *
 * These were CSS until now -- blurred blob meshes and a fan of drawn blades --
 * because the section had to ship as one file with no image assets. The
 * renders exist now (the three "* Corner.png" files beside this one), so the
 * cards carry the actual artwork instead of an impression of it, and the
 * one-file rule still holds: each is inlined as base64 WebP, cropped to the
 * lit corner of its 1254px original and resized to 480px wide -- roughly 3x
 * what a 296px card ever shows. Three of them cost ~45KB against the ~5MB the
 * untouched PNGs would have added.
 *
 * Each render is already cut off at its own right and bottom edge, so
 * anchoring at right:0 bottom:0 reproduces the reference's bleed exactly:
 * no negative offsets, and nothing to re-tune when the card changes height
 * between the laptop grid and the booth. The PNGs are transparent, not black,
 * so they composite onto the card rather than punching a near-black square
 * into it.
 */
.art { position: absolute; z-index: 1; pointer-events: none; }

.art.shot {
  right: 0; bottom: 0;
  height: 100%;
  aspect-ratio: 664 / 774;   /* the crop's own ratio, so nothing is squashed */
  background-repeat: no-repeat;
  background-position: right bottom;

/* ---------------- glassmorphic product icons ---------------- */

/*
 * Liquid glass, built in CSS rather than shipped as art: a translucent rounded
 * tile with a bright top-edge highlight, an inner bloom, a coloured glow behind
 * it, and a glyph floating above. Each product gets its own hue.
 */
.gicon {
  position: relative;
  width: 32px; height: 32px;
  flex: none;
  border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.05) 60%);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.55),
    inset 0 -7px 14px rgba(255,255,255,0.05),
    0 5px 14px rgba(0,0,0,0.5);
  overflow: hidden;
}
/* the specular sweep across the top half */
.gicon::before {
  content: '';
  position: absolute; inset: -40% -40% 45% -40%;
  background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
  filter: blur(3px);
}
/* the coloured light trapped inside the glass */
.gicon::after {
  content: '';
  position: absolute; width: 26px; height: 26px; right: -9px; bottom: -11px;
  border-radius: 50%;
  filter: blur(7px);
  opacity: 0.95;
  background: var(--ic, #00ad6c);
}
.gicon svg { position: relative; z-index: 3; width: 16px; height: 16px; color: #fff; }
/* Relay is the one product here with a real logo rather than a drawn glyph, so
   its tile carries the mark itself. It runs a little larger than the 16px
   glyphs because it is two thin strokes rather than one solid shape, and it
   keeps its own gradients instead of inheriting the white fill. */
.hcard.wide .gicon { width: 38px; height: 38px; border-radius: 12px; }
.hcard.wide .gicon svg { width: 19px; height: 19px; }

.ic-mint  { --ic: #00ad6c; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 5px 14px rgba(0,0,0,0.5), 0 0 20px rgba(0,173,108,0.38); }
.ic-gold  { --ic: #ffae15; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 5px 14px rgba(0,0,0,0.5), 0 0 20px rgba(255,174,21,0.34); }
.ic-cyan  { --ic: #1ed2f2; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 5px 14px rgba(0,0,0,0.5), 0 0 20px rgba(30,210,242,0.3); }
.ic-coral { --ic: #e64d73; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 5px 14px rgba(0,0,0,0.5), 0 0 20px rgba(230,77,115,0.28); }
.ic-lime  { --ic: #cef993; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 5px 14px rgba(0,0,0,0.5), 0 0 20px rgba(206,249,147,0.3); }

/* the blurred mesh blobs that bleed out of the reference's cards */
.hblob { position: absolute; border-radius: 50%; filter: blur(30px); pointer-events: none; opacity: 0.34; }
.hblob.br { width: 96px; height: 96px; right: -30px; bottom: -34px; }
.hblob.tr { width: 88px; height: 88px; right: -28px; top: -32px; }
.b-mint  { background: radial-gradient(circle at 32% 32%, #cef993, #00ad6c 62%, transparent 74%); }
.b-gold  { background: radial-gradient(circle at 36% 36%, #fce2b0, #ffae15 58%, transparent 74%); }
.b-cyan  { background: radial-gradient(circle at 36% 36%, #9feaf9, #1ed2f2 58%, transparent 74%); }
.b-mesh  { background: radial-gradient(circle at 30% 30%, #ffd9e2, #ffae15 40%, #00ad6c 74%, transparent 86%); }
.b-coral { background: radial-gradient(circle at 36% 36%, #ffc9d6, #e64d73 58%, transparent 74%); }

/* ---------------- tier 2: the three builder surfaces ---------------- */

.tier2 {
  position: absolute; inset: 0; z-index: 10;
  background: #000;
  overflow-y: auto;
  padding: 42px 11px 18px;
  display: flex; flex-direction: column; gap: 9px;
  transition: opacity 0.42s ease, filter 0.42s ease, transform 0.42s ease;
}
.tier2.gone { opacity: 0; filter: blur(12px); transform: scale(1.05); pointer-events: none; }
.tier2::-webkit-scrollbar { width: 0; }

.tier2 .t2head { padding: 0 5px 4px 40px; }
.tier2 .t2head .k {
  font-size: 11px; font-weight: 700; letter-spacing: 0.17em; text-transform: uppercase;
  color: rgba(244,245,244,0.4);
}
.tier2 .t2head .t {
  margin-top: 5px; font-size: 21px; font-weight: 700; letter-spacing: -0.025em; color: #f4f5f4;
}
.tier2 .t2head .t .thin { font-weight: 400; color: rgba(244,245,244,0.42); }

.t2card {
  position: relative; overflow: hidden;
  flex: 1;
  border: 1px solid #2a2a2a;
  border-radius: 20px;
  background: #0a0a0b;
  padding: 14px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.t2card:hover { transform: translateY(-2px); border-color: #3d3d3d; }
.t2card .row { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; }
.t2card .nm { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #f4f5f4; }
.t2card .nm .thin { font-weight: 400; color: rgba(244,245,244,0.42); }
.t2card .desc {
  position: relative; z-index: 3;
  margin: 8px 0 0; font-size: 12px; line-height: 1.45;
  color: rgba(244,245,244,0.58); max-width: 30ch;
}
.t2card .foot { position: relative; z-index: 3; display: flex; align-items: center; gap: 7px; }
.t2card .go {
  margin-left: auto; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
}

.b-lime  { background: radial-gradient(circle at 36% 36%, #eafcc8, #cef993 52%, #7bc44a 74%, transparent 84%); }


/* Back chevron. Must out-rank the home (9) and tier-2 (10) overlays or it is
   unclickable exactly when it is needed — which is how it broke once already. */
.backbtn {
  position: absolute; top: 44px; left: 12px; z-index: 14;
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  background: #fff;
  border: 1px solid rgba(29,34,31,0.12);
  box-shadow: 0 3px 10px rgba(29,34,31,0.12);
  cursor: pointer;
}
.backbtn svg { width: 14px; height: 14px; }



/* ---------------- level 2b: the Relay agent shelf ---------------- */

/*
 * Relay is not one demo, it is a shelf of agents with one payment operation
 * each. So the Relay card opens a picker first, and the agent you choose
 * decides which conversation the phone then runs.
 *
 * The orbs are lifted from the beta-access form (../Checkout Screen/relay-beta-form
 * Final.html) -- same gradient recipes, same eyes. What is deliberately NOT
 * lifted is that form's cursor-tracking 3D tilt: this screen is a menu you
 * click, the card itself already answers the hover, and a ball leaning at the
 * pointer fights the tap. The blink stays, because that is what makes an agent
 * read as alive rather than as an icon.
 */
.agentpick {
  position: absolute; inset: 0; z-index: 11;
  background: #000;
  overflow-y: auto;
  padding: 42px 11px 18px;
  display: flex; flex-direction: column; gap: 9px;
  transition: opacity 0.42s ease, filter 0.42s ease, transform 0.42s ease;
}
.agentpick.gone { opacity: 0; filter: blur(12px); transform: scale(1.05); pointer-events: none; }
.agentpick::-webkit-scrollbar { width: 0; }

.agentpick .aphead { padding: 0 5px 4px 40px; }
.agentpick .aphead .k {
  font-size: 11px; font-weight: 700; letter-spacing: 0.17em; text-transform: uppercase;
  color: rgba(244,245,244,0.4);
}
.agentpick .aphead .t {
  margin-top: 5px; font-size: 21px; font-weight: 700; letter-spacing: -0.025em; color: #f4f5f4;
}
.agentpick .aphead .t .thin { font-weight: 400; color: rgba(244,245,244,0.42); }

.acard {
  position: relative; overflow: hidden;
  flex: 1;
  border: 1px solid #2a2a2a;
  border-radius: 20px;
  background: #0a0a0b;
  padding: 13px 14px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.acard:hover { transform: translateY(-2px); border-color: #3d3d3d; }
.acard .row { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; }
.acard .nm { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #f4f5f4; }
.acard .nm .thin { font-weight: 400; color: rgba(244,245,244,0.42); }
.acard .desc {
  position: relative; z-index: 3;
  margin: 7px 0 0; font-size: 11.5px; line-height: 1.45;
  color: rgba(244,245,244,0.58); max-width: 34ch;
}
.acard .foot { position: relative; z-index: 3; display: flex; align-items: center; gap: 8px; }
.acard .stat {
  font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: rgba(0,173,108,0.16); color: #9ce6bf; border: 1px solid rgba(0,173,108,0.24);
  white-space: nowrap;
}
.acard .go {
  margin-left: auto; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
}
.acard .go svg { width: 11px; height: 11px; color: rgba(244,245,244,0.75); }

/*
 * Relay's onboarding screen -- the first thing a merchant meets.
 *
 * This is the one level in the section that is NOT dressed in the black bento
 * or in Cashfree green: it is Relay's own product surface, and Relay's is a
 * light card on a light ground with an indigo accent. Keeping it in the house
 * palette would have made it read as a third Cashfree dashboard rather than as
 * the thing the merchant is actually looking at.
 *
 * Only .ob-row.on is live: the screen is scenery for the agent you already
 * picked off the shelf, and the eye needs telling which row that was.
 */
.onboard {
  position: absolute; inset: 0; z-index: 11;
  background: #f4f5f8;
  overflow-y: auto;
  padding: 42px 12px 18px;
  display: flex; flex-direction: column; justify-content: center;
  transition: opacity 0.42s ease, filter 0.42s ease, transform 0.42s ease;
}
.onboard.gone { opacity: 0; filter: blur(12px); transform: scale(1.05); pointer-events: none; }
.onboard::-webkit-scrollbar { width: 0; }

.ob-card {
  background: #fff;
  border: 1px solid rgba(24, 27, 44, 0.08);
  border-radius: 20px;

/* --- the orbs --- *
 *
 * ONE size token, and every part of the face is a ratio of it.
 *
 * The orb is drawn at 52px on the shelf and then reused at 58, 26, 22 and 17
 * -- in a call, in a push notification, in the header chip, on the on-the-call
 * strip. Those call sites used to set width and height and nothing else, so
 * the eyes stayed at their 52px metrics: 5x10 with an 8px gap, which is an
 * 17.5px block of face inside a 26px ball and an 18px block inside a 17px one.
 * Wider than the head. The outline offset did the same thing, ringing a 17px
 * ball at the 3px it was drawn for at 52.
 *
 * So the size lives in `--o` and everything else is calc()'d off it. A new
 * call site sets `--o` and gets the same agent, at a different size, rather
 * than a caricature of it. Ratios are exactly the 52px values divided by 52,
 * so the shelf orb is untouched to the pixel.
 */
.orb {
  --o: 52px;
  position: relative; flex: none;
  width: var(--o); height: var(--o); border-radius: 50%;
  box-shadow: 0 calc(var(--o) * 0.1538) calc(var(--o) * 0.3462) rgba(0,0,0,0.5);
  outline: calc(var(--o) * 0.0288) solid rgba(255,255,255,0.2);
  outline-offset: calc(var(--o) * 0.0577);
}
/* the gradient artwork lives on ::before, slightly oversized and softened */
.orb::before {
  content: ''; position: absolute; inset: -4%; border-radius: 50%;
  filter: blur(calc(var(--o) * 0.0269));
}
.orb .eyes {
  position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%);
  display: flex; gap: calc(var(--o) * 0.1538); z-index: 1;
}
.orb .eyes i {
  width: calc(var(--o) * 0.0962); height: calc(var(--o) * 0.1923);
  border-radius: calc(var(--o) * 0.0769); display: block;
  background: #15191a; transform-origin: 50% 50%;
}
.orb .eyes.blinking i { animation: eyeblink 0.28s ease-in-out both; }
@keyframes eyeblink { 0%, 100% { transform: scaleY(1); } 45%, 55% { transform: scaleY(0.08); } }
@media (prefers-reduced-motion: reduce) { .orb .eyes.blinking i { animation: none; } }

/* ---- the phone as Claude's phone ----
 *
 * Closer to the app a merchant would actually be holding: the ivory ground
 * with its warm bleed top and bottom, the uneven three-line menu opposite the
 * ghost, an empty thread that opens on the starburst and a greeting, and a
 * composer that is a card with its own control row rather than one flat pill.
 * The Pro upsell above the composer is deliberately NOT here -- it is the one
 * strip on that screen selling something, and this phone sells Cashfree.
 */
.screen.skin-claude {
  background:
    radial-gradient(130% 30% at 50% 0%, #f4f1e2 0%, rgba(244, 241, 226, 0) 100%),
    radial-gradient(130% 24% at 50% 100%, #f4f1e2 0%, rgba(244, 241, 226, 0) 100%),
    #faf9f5;
}

/* Header: menu, title, ghost -- the three things Claude's own header holds.
   The two auto margins split the free space, so the one chip left in the
   middle sits centred between them the way a chat title does. */
.screen.skin-claude .ph-top { padding: 44px 15px 8px 47px; gap: 7px; }
.cl-ic { display: none; flex: none; width: 25px; height: 25px; color: #33312c; }
.screen.skin-claude .cl-ic { display: block; }
.screen.skin-claude .cl-ghost { margin-left: auto; }
.screen.skin-claude .chip {
  margin-left: auto; min-width: 0;
  background: #efece3; border: 0; box-shadow: none;
  color: rgba(42, 39, 36, 0.56); padding: 4px 10px;
  overflow: hidden; text-overflow: ellipsis;
}

/* An empty thread is Claude's home screen. --cl-greet is set per run, because
   the app greets you by the time of day and so should the phone. */
.screen.skin-claude .thread:empty::before {
  content: var(--cl-greet, "Good afternoon");
  margin: auto; padding-top: 74px; text-align: center;
  background: var(--cl-mark) no-repeat top center / 54px 54px;
  font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  font-size: 22px; letter-spacing: -0.015em; color: #2a2724;
}

/* replies are plain text under the mark, the way Claude renders them */
.screen.skin-claude .bubble-ai {
  max-width: 100%; padding: 3px 2px 5px 0; gap: 9px;
  font-size: 14px; line-height: 1.52;
}
.screen.skin-claude .tick {
  width: 15px; height: 15px; border-radius: 0; margin-top: 2px;
  background: var(--cl-mark) no-repeat center / contain;
}
.screen.skin-claude .tick svg { display: none; }
.screen.skin-claude .bubble-me {
  border-radius: 19px; padding: 9px 14px; font-size: 13.8px;
  background: #efece3; border: 0;
}
.screen.skin-claude .toolrow {
  background: #f4f2ea; border-color: rgba(42, 39, 36, 0.08); border-radius: 12px;
}

/* composer: a card, the line you are writing, then the control row under it */
.screen.skin-claude .composer {
  flex-wrap: wrap; align-items: center; gap: 7px;
  margin: 0 12px 16px; padding: 12px 10px 10px 13px;
  border-radius: 25px; background: #fff;
  border: 1px solid rgba(42, 39, 36, 0.07);
  box-shadow: 0 6px 20px rgba(42, 39, 36, 0.07);
}
.screen.skin-claude .composer .txt { flex: 1 0 100%; padding: 2px 2px 9px; font-size: 14.5px; }
.screen.skin-claude .composer .txt.ph { color: rgba(42, 39, 36, 0.42); }
.cl-btn, .cl-model { display: none; }
.screen.skin-claude .cl-btn {
  display: grid; place-items: center; flex: none;
  width: 31px; height: 31px; border-radius: 50%;
  background: #f1efe7; color: #45423c;
}
.screen.skin-claude .cl-btn svg { width: 15px; height: 15px; }
.screen.skin-claude .cl-model {
  display: inline-flex; align-items: center; gap: 5px;

}
.screen.skin-claude .cl-model .thin { font-weight: 400; color: rgba(42, 39, 36, 0.48); }
.screen.skin-claude .cl-mic { margin-left: auto; }
.screen.skin-claude .send { width: 32px; height: 32px; background: #1f1e1d; }


/* ---- the phone as Spark's phone ----
 *
 * Spark opens on the chat, so the phone IS the chat. The shape is the one every
 * assistant on a phone now shares -- panel toggle, product name with a chevron,
 * compose square; the merchant's prompts as pills on the right, the replies as
 * plain text under the mark; a composer that is a card rather than a bar. That
 * layout is convention now, and fighting it would only make Spark look harder
 * to use than it is. The clothes on top of it are ours.
 *
 * The palette is the 2026 direction the rest of the phone already runs on: a
 * near-white ground with mint bleeding in at the top and oat at the bottom,
 * evergreen for anything live, the house mint bubble for the merchant's own
 * words, and frosted white for the two surfaces that float above the thread --
 * the ledger and the composer.
 *
 * --cf-mark is the same Cashfree mark CX_ICON.cf hands the connect cards and
 * the WhatsApp link, as a background image rather than an <img>.
 */

/* header: panel, the product name, the run's own chips, compose square */
.screen.skin-spark .ph-top { padding: 44px 13px 8px 46px; gap: 6px; }
.screen.skin-spark .cl-ic { display: block; color: var(--graphite); width: 23px; height: 23px; }
.screen.skin-spark .sk-new { margin-left: auto; }
.sk-title { display: none; }
.screen.skin-spark .sk-title {
  display: inline-flex; align-items: center; gap: 3px; flex: none;
  font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: var(--graphite);
}
.screen.skin-spark .sk-title svg { width: 11px; height: 11px; color: rgba(29, 34, 31, 0.42); }
.screen.skin-spark .chip {
  min-width: 0; padding: 4px 8px; font-size: 10px;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(29, 34, 31, 0.08);
  box-shadow: none;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: rgba(29, 34, 31, 0.6);
  overflow: hidden; text-overflow: ellipsis;
}
.screen.skin-spark .chip .gdot { background: var(--evergreen); }

/* An empty thread is the new-chat screen: the mark, and the one line it asks. */
.screen.skin-spark .thread:empty::before {
  content: "What can I help with?";
  margin: auto; padding-top: 58px; text-align: center;
  background: var(--cf-mark) no-repeat top center / 40px 40px;
  font-size: 20px; font-weight: 700; letter-spacing: -0.025em; color: var(--graphite);
}

/* replies are plain text under the mark -- no bubble, no card */
.screen.skin-spark .bubble-ai {
  max-width: 100%; padding: 3px 2px 5px 0; gap: 9px;
  background: transparent; border: 0; box-shadow: none;
  font-size: 14px; line-height: 1.58; color: var(--graphite);
}
/* the mark sits on its own white disc, because the ground under it is a mint
   wash rather than flat white and the logo has its own colours to keep */
.screen.skin-spark .tick {
  width: 22px; height: 22px; margin-top: 0; border-radius: 50%;
  background: #fff var(--cf-mark) no-repeat center / 15px 15px;
  border: 1px solid rgba(0, 173, 108, 0.22);
}
.screen.skin-spark .tick svg { display: none; }

/* the merchant's prompts: the house mint bubble, in the assistant-app shape */
.screen.skin-spark .bubble-me {
  max-width: 80%; padding: 9px 15px; border-radius: 20px;
  background: #e6f7cd; border: 0; box-shadow: none;
  font-size: 14px; line-height: 1.5; color: var(--graphite);
}
.screen.skin-spark .toolrow {
  background: rgba(255, 255, 255, 0.72);
  border-color: rgba(0, 173, 108, 0.16); border-radius: 12px;
}
.screen.skin-spark .toolrow .nm { color: #0a6b48; }

.screen.skin-spark .ledger {
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(29, 34, 31, 0.08);
  box-shadow: 0 6px 20px rgba(29, 34, 31, 0.05);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.screen.skin-spark .lrow .pip { background: rgba(29, 34, 31, 0.18); }
.screen.skin-spark .lrow.on .pip { background: var(--evergreen); }
/* an approval still pending stays amber -- the skin colours the ledger, it does
   not get to overrule what the ledger is saying */
.screen.skin-spark .lrow.warn .pip { background: var(--gold); }
.screen.skin-spark .caret { background: var(--evergreen); }

/* composer: the line you are writing, then plus / mic / send under it */
.screen.skin-spark .composer {
  flex-wrap: wrap; align-items: center; gap: 7px;
  margin: 0 12px 16px; padding: 12px 10px 10px 14px;
  border-radius: 26px;
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid rgba(29, 34, 31, 0.09);
  box-shadow: 0 6px 20px rgba(29, 34, 31, 0.07);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.screen.skin-spark .composer .txt { flex: 1 0 100%; padding: 2px 2px 9px; font-size: 14.5px; }
.screen.skin-spark .composer .txt.ph { color: rgba(29, 34, 31, 0.42); }
.screen.skin-spark .cl-btn {
  display: grid; place-items: center; flex: none;
  width: 27px; height: 27px; border-radius: 50%;
  background: transparent; color: rgba(29, 34, 31, 0.55);
}
.screen.skin-spark .cl-btn svg { width: 19px; height: 19px; }
.screen.skin-spark .cl-mic { margin-left: auto; }
.screen.skin-spark .cl-mic svg { width: 16px; height: 16px; }
.screen.skin-spark .send { width: 31px; height: 31px; background: var(--evergreen); }


/* ---------------- inline connect card ---------------- */

/*
 * The connect beat is a turn in the conversation, not a gate in front of it:
 * you ask to connect, the card appears in the thread and wires itself up, then
 * the assistant confirms and the rest of the prompts follow. Same scroll, same
 * rhythm as every other step.
 */
.cxi {
  position: relative;
  padding: 13px 14px 12px;
  border-radius: 17px;
  background: #fff;
  border: 1px solid rgba(29,34,31,0.10);
  box-shadow: 0 2px 10px rgba(29,34,31,0.06);
  max-width: 96%;
}
.cxi-pair { display: flex; align-items: center; justify-content: center; gap: 0; }
.cxi-node { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 82px; }
.cxi-node .tile {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  background: #fff;
  border: 1px solid rgba(29,34,31,0.12);
  box-shadow: none;
}
.cxi-node .tile svg { width: 19px; height: 19px; }
/* The Cashfree mark ships as artwork rather than as a path we redraw, so it is
   an <img> among inline SVGs. It fills whatever box it is given; the connect
   tile is the one place that needs an explicit size. */
img.cfmark { display: block; object-fit: contain; max-width: 100%; max-height: 100%; }
.cxi-node .tile img.cfmark { width: 24px; height: 24px; }
.wa .wlink .lt .cfl img.cfmark { width: 14px; height: 14px; }
.cxi-node .nm {
  font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.2;
  color: rgba(29,34,31,0.78);
}
.cxi-wire { position: relative; width: 54px; height: 2px; margin-bottom: 18px;
  background: rgba(29,34,31,0.14); border-radius: 2px; }
.cxi-wire .fill {
  position: absolute; inset: 0; width: 0; border-radius: 2px;
  background: var(--evergreen);
  transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
}
.cxi.live .cxi-wire .fill { width: 100%; }
.cxi-wire .bead {
  position: absolute; top: 50%; left: 0; width: 6px; height: 6px;
  margin: -3px 0 0 -3px; border-radius: 50%; background: var(--evergreen);
  box-shadow: 0 0 0 3px rgba(0,173,108,0.18); opacity: 0;
}
.cxi.live .cxi-wire .bead { animation: bead 1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

.cxi-via {
  margin-top: 10px; text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; color: rgba(29,34,31,0.5); word-break: break-all;
}
.cxi-foot { margin-top: 11px; display: flex; align-items: center; justify-content: center; gap: 9px; }
.cxi-sw { position: relative; width: 34px; height: 20px; border-radius: 999px;
  background: rgba(29,34,31,0.18); transition: background 0.34s ease; }
.cxi-sw .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.22);
  transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1); }
.cxi.live .cxi-sw { background: var(--evergreen); }
.cxi.live .cxi-sw .knob { transform: translateX(14px); }
.cxi-state { font-size: 12px; font-weight: 600; color: rgba(29,34,31,0.5); }
.cxi.live .cxi-state { color: #04663f; }

.screen.skin-claude .cxi.live .cxi-sw { background: #d97757; }
.screen.skin-claude .cxi.live .cxi-wire .fill { background: #d97757; }
.screen.skin-claude .cxi-wire .bead { background: #d97757; box-shadow: 0 0 0 3px rgba(217,119,87,0.18); }
.screen.skin-claude .cxi.live .cxi-state { color: #7a4630; }
.screen.skin-claude .cxi { background: #fff; border-color: rgba(42,39,36,0.09); }

/* ---------------- Relay: voice in, buyer screen, and the call ----------------
 *
 * The Relay docs (../Checkout Screen/{Cart,Payment} Recovery.docx) tell each
 * agent's story in three segments, and only the first of them is a chat:
 *
 *   1. the merchant SAYS what they want          -> .vcap    (voice capture)
 *   2. the buyer drops off on their OWN screen   -> .buyscr  (buyer's screen)
 *   3. the agent CALLS the buyer                 -> .callscene
 *
 * So none of the three is drawn as a bubble. Voice gets a meter and the Indic
 * glyphs that say out loud this is not an English-only product; the buyer's
 * screen is drawn as a small separate device inside the thread so it can never
 * be read as the merchant's own phone; and the call takes the whole screen,
 * because that is what a call does to a phone.
 */

/* --- 1. voice capture ---------------------------------------------------- */

.vcap {
  position: absolute; inset: 0; z-index: 12;
  background: rgba(252, 252, 251, 0.74);
  -webkit-backdrop-filter: blur(9px) saturate(1.08);
  backdrop-filter: blur(9px) saturate(1.08);
  animation: vcapIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.vcap.gone { animation: vcapOut 0.34s ease both; }
@keyframes vcapIn  { from { opacity: 0 } to { opacity: 1 } }
@keyframes vcapOut { to { opacity: 0; transform: scale(1.04) } }

.vstage {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}

/* the meter. Seven bars, each with its own peak and phase, so it reads as a
   voice rather than as a loader. */
.vbars { display: flex; align-items: center; gap: 7px; height: 92px; }
.vbars i {
  display: block; width: 10px; border-radius: 7px; height: 18px;
  background: linear-gradient(180deg, #3d7dff 0%, #1546c8 100%);
  box-shadow: 0 4px 12px rgba(31, 84, 216, 0.28);
  animation: vbar 0.92s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes vbar { 0%, 100% { height: 16px } 50% { height: var(--h, 54px) } }

.vcap .vlabel {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 700; letter-spacing: -0.01em; color: var(--graphite);
}
.vcap .vlabel .rec {
  width: 7px; height: 7px; border-radius: 50%; background: #e0483f;
  animation: recpulse 1.1s ease-in-out infinite;
}
@keyframes recpulse { 0%, 100% { opacity: 1; transform: scale(1) } 50% { opacity: 0.35; transform: scale(0.82) } }

/* Indic glyph chips, placed the way the doc frames them: a loose ring around
   the meter, not a grid. Sizes and tints vary so the ring reads as scattered. */
.vg {
  position: absolute;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 15px; font-weight: 700; line-height: 1;
  background: #fff;
  box-shadow: 0 6px 16px rgba(29, 34, 31, 0.14), 0 0 0 1px rgba(29, 34, 31, 0.05);
  animation: vfloat 3.4s ease-in-out infinite;
}
.vg.sm { width: 28px; height: 28px; font-size: 12.5px; }
@keyframes vfloat {
  0%, 100% { transform: translateY(0) }
  50%      { transform: translateY(-7px) }
}
@media (prefers-reduced-motion: reduce) {
  .vg { animation: none }
  .vbars i { animation: none; height: 34px }
}

/* --- 2. the buyer's screen ----------------------------------------------- */

.buyscr {
  width: 100%; overflow: hidden;
  border-radius: 18px;
  border: 1px solid rgba(29, 34, 31, 0.13);
  background: #fff;
  box-shadow: 0 8px 22px rgba(29, 34, 31, 0.09);
}
.buyscr .bs-tag,
.paysheet .bs-tag {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 11px;
  background: #f6f6f4; border-bottom: 1px solid rgba(29, 34, 31, 0.08);
  font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.44);
}
.buyscr .bs-tag .live,
.paysheet .bs-tag .live {
  width: 5px; height: 5px; border-radius: 50%; background: var(--coral);
  animation: recpulse 1.4s ease-in-out infinite;
}
/* the merchant panel, in the brick the Cashfree checkout actually uses */
.buyscr .bs-brand {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 12px;
  background: linear-gradient(150deg, #6d2620 0%, #571c17 100%);
  color: #fff;
}
.buyscr .bs-brand .glyph {
  flex: none; width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center; font-size: 13px;
  background: rgba(255, 255, 255, 0.13); border: 1px solid rgba(255, 255, 255, 0.18);
}
.buyscr .bs-brand .who { min-width: 0 }
.buyscr .bs-brand .nm {
  display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.buyscr .bs-brand .tr { display: block; margin-top: 1px; font-size: 9px; color: rgba(255, 255, 255, 0.6) }
.buyscr .bs-brand .amt {
  margin-left: auto; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.buyscr .bs-body { padding: 10px 11px 11px }
.buyscr .bs-h { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; letter-spacing: -0.015em }
.buyscr .bs-ic { flex: none; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center }
.buyscr .bs-ic svg { width: 9px; height: 9px }
.buyscr .bs-reason {
  margin-top: 7px; padding: 7px 9px; border-radius: 10px;
  font-size: 11px; line-height: 1.42;
}
.buyscr .bs-meta {
  margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
  color: rgba(29, 34, 31, 0.42);
}
/* the exit prompt's reasons, with the one the buyer picked filled in */
.buyscr .bs-opts { margin-top: 8px; display: flex; flex-direction: column; gap: 5px }
.buyscr .bs-opt { display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: rgba(29, 34, 31, 0.5) }
.buyscr .bs-opt i {
  flex: none; width: 11px; height: 11px; border-radius: 50%;
  border: 1.5px solid rgba(29, 34, 31, 0.22);
}
.buyscr .bs-opt.on { color: var(--graphite); font-weight: 500 }
.buyscr .bs-opt.on i { border-color: var(--gold); box-shadow: inset 0 0 0 2.5px var(--gold) }

/* failed vs abandoned vs settled: red for money that bounced, amber for money
   that walked, green for money that finally landed */
.buyscr.fail .bs-ic { background: #d64545 }
.buyscr.fail .bs-reason { background: #fdeeee; border: 1px solid rgba(214, 69, 69, 0.2); color: #8d2b2b }
.buyscr.drop .bs-ic { background: var(--gold) }
.buyscr.drop .bs-reason { background: #fff6e6; border: 1px solid rgba(255, 174, 21, 0.28); color: #7a5312 }
.buyscr.ok .bs-ic { background: var(--evergreen) }
.buyscr.ok .bs-reason { background: #edfaf3; border: 1px solid rgba(0, 173, 108, 0.24); color: #0d5f40 }

/* The buttons a failed checkout actually puts in front of the buyer, and the
   line of small print under them. Payment Recovery's whole argument is that
   these two are not enough: Retry is the same bank that just said no, and
   "try another method" is a menu with no advice in it. Drawn, so the call in
   segment 3 is visibly doing what this screen could not. */
.buyscr .bs-acts { margin-top: 9px; display: flex; flex-direction: column; gap: 6px }
.buyscr .bs-act {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px; border-radius: 9px;
  font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
  border: 1px solid rgba(29, 34, 31, 0.14); color: var(--graphite);
}
.buyscr .bs-act.pri { background: #6b76ec; border-color: #6b76ec; color: #fff }
.buyscr .bs-act svg { width: 12px; height: 12px; flex: none }
.buyscr .bs-note {
  margin-top: 8px; display: flex; align-items: flex-start; gap: 5px;
  font-size: 9.5px; line-height: 1.4; color: rgba(29, 34, 31, 0.46);
}
.buyscr .bs-note svg { width: 10px; height: 10px; flex: none; margin-top: 1px }

/* --- the buyer's cart, and the sheets that land on top of it -------------- *
 *
 * Cart Recovery's segment 2 is two beats on ONE screen: the cart, then the exit
 * prompt over it. Drawn as two unrelated cards they lose the only thing that
 * makes an abandoned cart read as abandoned -- that the basket is still sitting
 * there when she walks. So the sheet is positioned over the same device and the
 * cart dims underneath it rather than being replaced.
 */
.buyscr { position: relative; }
.buyscr.sheeted .bs-body { opacity: 0.32; }

.bs-cart .hd {
  display: flex; align-items: baseline;
  padding: 0 1px 6px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.44);
}
.bs-cart .hd .n {
  margin-left: auto; font-weight: 600; letter-spacing: 0; text-transform: none;
  font-size: 9.5px;
}
.bs-cline {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px;
  background: #fff;
  border: 1px solid rgba(29, 34, 31, 0.1);
  border-radius: 11px;
}
.bs-cline + .bs-cline { margin-top: 5px; }
.bs-cline .pic {
  flex: none; width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center; background: #f4f4f2;
}
.bs-cline .pic svg { width: 22px; height: 22px; }
.bs-cline .tx { flex: 1; min-width: 0; }
.bs-cline .tx b {
  display: block; font-size: 10.5px; font-weight: 700; line-height: 1.25;
  color: var(--graphite);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bs-cline .tx i {
  display: block; margin-top: 2px; font-style: normal;
  font-size: 9px; color: rgba(29, 34, 31, 0.5);
}
/* "+1 more item" -- the reference's own way of holding a second identical line
   without spending a second 45px row on it */
.bs-cline .tx em {
  display: block; margin-top: 2px; font-style: normal;

/* the offers strip the Cashfree checkout puts above the cart */
.bs-offer {
  display: flex; align-items: center; gap: 7px;

  background: #f4fcf8; border: 1px dashed rgba(0, 173, 108, 0.34);
}
.bs-offer .cd {
  flex: none; font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.03em;

  background: rgba(0, 173, 108, 0.13); color: #0d5f40;
}
.bs-offer .ds {

.bs-sum {

.bs-sum .r.tot {

}

/* the sheet: same box for the exit prompt and for the receipt */
.bs-sheet {
  position: absolute; left: 9px; right: 9px; bottom: 9px;
  padding: 12px 12px 11px;
  border-radius: 14px;
  background: #fff;
  border: 1px solid rgba(29, 34, 31, 0.1);
  box-shadow: 0 -6px 24px rgba(29, 34, 31, 0.16);

}
@keyframes sheetUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) { .bs-sheet { animation: none; } }

.bs-exit .xh { font-size: 13px; font-weight: 700; letter-spacing: -0.02em; color: var(--graphite); }
.bs-exit .xs { margin-top: 3px; font-size: 10px; color: rgba(29, 34, 31, 0.55); }
.bs-exit .bs-opts { margin-top: 9px; }
/* the reference's second reason runs to two lines, and a radio centred against
   a two-line label reads as though it belongs to neither. Hang it off the top
   instead, so the wrap indents under its own first line. */
.bs-exit .bs-opt { align-items: flex-start; line-height: 1.4; }
.bs-exit .bs-opt i { margin-top: 1.5px; }
.bs-exit .xgo {
  margin-top: 11px; padding: 9px;
  border-radius: 9px; text-align: center;
  background: #6b76ec; color: #fff;
  font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
}
.bs-exit .xleave {
  margin-top: 8px; text-align: center;
  font-size: 10.5px; font-weight: 700; color: #d64545;
}

.bs-failed { text-align: center; }
.bs-failed .fh {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 700; letter-spacing: -0.02em; color: var(--graphite);
}
.bs-failed .fs { margin-top: 3px; font-size: 10px; color: rgba(29, 34, 31, 0.55); }
.bs-failed .bs-reason { margin-top: 9px; text-align: left; }
.bs-failed .bs-acts { text-align: left; }
.bs-failed .bs-note { text-align: left; }

.bs-done { text-align: center; }
.bs-done .big {
  width: 34px; height: 34px; margin: 0 auto 8px; border-radius: 50%;
  display: grid; place-items: center; background: var(--evergreen);
  animation: donePop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
}
.bs-done .big svg { width: 17px; height: 17px; }
@keyframes donePop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bs-done .big { animation: none; } }
.bs-done .t { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: -0.02em; color: var(--graphite); }
.bs-done .amt {
  display: block; margin-top: 2px;
  font-size: 19px; font-weight: 700; letter-spacing: -0.03em; color: var(--graphite);
  font-variant-numeric: tabular-nums;
}
.bs-done .sub {
  display: block; margin-top: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: rgba(29, 34, 31, 0.44);
}

/* --- "It's live" ---------------------------------------------------------- */
.livecard {
  width: 100%;
  padding: 11px 12px 12px;
  border-radius: 15px;
  background: #edfaf3;
  border: 1px solid rgba(0, 173, 108, 0.26);
}
.livecard .lv-top {
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px; font-weight: 700; letter-spacing: -0.01em; color: #0d5f40;
}
.livecard .lv-top .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--evergreen);
  box-shadow: 0 0 0 0 rgba(0, 173, 108, 0.5);
  animation: recpulse 1.6s ease-in-out infinite;
}
.livecard .lv-b {
  margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: #14624a;
}

/*
 * The push, and the banner under it.
 *
 * A renewal is the one failure the customer is not standing in front of: they
 * are not at a checkout, so the only way they learn about it is a notification.
 * The Subscription Dunning doc opens on exactly that, so the notification is
 * drawn as a real push sitting on top of the app rather than described in a
 * sentence, and the "Subscription paused" state slides up under it.
 */
.buyscr .bs-notif {
  display: flex; align-items: flex-start; gap: 8px;
  margin: 9px 10px 0; padding: 8px 10px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(29, 34, 31, 0.1);
  box-shadow: 0 8px 20px rgba(29, 34, 31, 0.13);
  animation: notifIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes notifIn {
  from { opacity: 0; transform: translateY(-11px) scale(0.97) }
  to   { opacity: 1; transform: none }
}
.buyscr .bs-notif .ic {
  flex: none; width: 20px; height: 20px; border-radius: 6px;
  display: grid; place-items: center; font-size: 10px;
  background: linear-gradient(150deg, #6d2620 0%, #571c17 100%);
}
.buyscr .bs-notif .nx { min-width: 0; flex: 1 }
.buyscr .bs-notif .nt {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.5);
}
.buyscr .bs-notif .nt .when {
  margin-left: auto; font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0; text-transform: none; color: rgba(29, 34, 31, 0.36);
}
.buyscr .bs-notif .nh { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; letter-spacing: -0.015em }
.buyscr .bs-notif .nb { display: block; margin-top: 2px; font-size: 10.5px; line-height: 1.4; color: rgba(29, 34, 31, 0.6) }

.buyscr .bs-banner {
  margin: 8px 0 0; padding: 6px 9px;
  border-radius: 9px;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 6px;
  animation: bannerUp 0.44s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both;
}
.buyscr .bs-banner i { width: 5px; height: 5px; border-radius: 50%; background: currentColor }
.buyscr.fail .bs-banner { background: #f4e6e6; color: #8d2b2b }
.buyscr.ok .bs-banner { background: #e4f6ec; color: #0d5f40 }
@keyframes bannerUp {
  from { opacity: 0; transform: translateY(9px) }
  to   { opacity: 1; transform: none }
}
@media (prefers-reduced-motion: reduce) {
  .buyscr .bs-notif, .buyscr .bs-banner { animation: none }
}

/* --- the EMI order, and where in the plan it broke ------------------------ *
 *
 * A bounced instalment is neither a checkout error nor a paused SaaS plan. It
 * is one line of a plan the buyer is halfway through, with a delivery hanging
 * off it -- so the screen has to carry the ORDER (what is being held) and the
 * SCHEDULE (where it broke), or the stakes never read.
 *
 * Two rows rather than one. The badge is the whole point of the block, since
 * it is what says money failing has stopped a delivery, so it must never be
 * the thing that gets squeezed: giving it the second row beside the mono meta
 * line lets the title own the full width and stops both from ellipsing.
 */
.buyscr .bs-order {
  display: grid; grid-template-columns: 34px 1fr; column-gap: 9px; row-gap: 4px;
  align-items: center;
  margin-top: 9px; padding: 8px 9px;
  border-radius: 12px;
  background: #faf9f7; border: 1px solid rgba(29, 34, 31, 0.09);
}
.buyscr .bs-order .pic {
  grid-row: 1 / 3; align-self: center;
  width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center;
  background: #fff; border: 1px solid rgba(29, 34, 31, 0.09);
}
.buyscr .bs-order .pic svg { width: 24px; height: 24px }
.buyscr .bs-order b {
  grid-column: 2; min-width: 0;
  font-size: 11.5px; font-weight: 700; letter-spacing: -0.015em; color: var(--graphite);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.buyscr .bs-order .mt {
  grid-column: 2;
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 7px; align-items: center;
}
.buyscr .bs-order .mt i {
  min-width: 0; font-style: normal;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(29, 34, 31, 0.46);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Named for the delivery state rather than the colour -- and deliberately not
   `.hold`, because a bare state word is exactly the class name some layout
   wrapper elsewhere in this file will also want, and that collision is silent:
   the badge simply inherits the wrapper's width and blows out of the card. */
.buyscr .bs-badge {
  padding: 3px 6px; border-radius: 5px;
  font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  white-space: nowrap;
}
.buyscr .bs-badge.paused { background: #fdeeee; color: #a33232; border: 1px solid rgba(214, 69, 69, 0.22) }
.buyscr .bs-badge.moving { background: #edfaf3; color: #0d5f40; border: 1px solid rgba(0, 173, 108, 0.26) }

/* Three rows, because the buyer's stake is the two instalments either side of
   the one that failed -- one already paid, one still coming. */
.buyscr .bs-emi { margin-top: 10px }
.buyscr .bs-emi .eh {
  padding: 0 1px 6px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.44);
}
.buyscr .bs-erow { display: flex; align-items: center; gap: 8px; padding: 6px 1px }
.buyscr .bs-erow + .bs-erow { border-top: 1px solid rgba(29, 34, 31, 0.07) }
.buyscr .bs-erow .st {
  flex: none; width: 15px; height: 15px; border-radius: 50%;
  display: grid; place-items: center; font-size: 8px; font-weight: 700; color: #fff;
}
.buyscr .bs-erow .st svg { width: 8px; height: 8px }
.buyscr .bs-erow.paid .st { background: var(--evergreen) }
.buyscr .bs-erow.fail .st { background: #d64545 }
.buyscr .bs-erow.due  .st { background: #fff; color: rgba(29, 34, 31, 0.4); border: 1.5px solid rgba(29, 34, 31, 0.18) }
.buyscr .bs-erow .tx { flex: 1; min-width: 0 }
.buyscr .bs-erow .tx b { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: -0.01em; color: var(--graphite) }
.buyscr .bs-erow .tx i { display: block; margin-top: 1px; font-style: normal; font-size: 9px; color: rgba(29, 34, 31, 0.46) }
.buyscr .bs-erow .pz {
  flex: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
  color: rgba(29, 34, 31, 0.85); font-variant-numeric: tabular-nums;
}
.buyscr .bs-erow.fail .tx i, .buyscr .bs-erow.fail .pz { color: #a33232 }
.buyscr .bs-erow.due .tx b, .buyscr .bs-erow.due .pz { color: rgba(29, 34, 31, 0.45) }

/* The button the buyer is being left alone with -- the thing the agent exists
   to make unnecessary, so it is drawn as a real CTA rather than a hint. */
.buyscr .bs-cta {
  margin-top: 11px; padding: 9px; border-radius: 11px;
  background: var(--graphite); color: #fff; text-align: center;
  font-size: 11.5px; font-weight: 700; letter-spacing: -0.01em;
}

/* a letter mark needs a colour on the brick tile; an emoji ignores it */
.buyscr .bs-notif .ic { color: #fff }

/* --- the checkout the payment link opens ---------------------------------- *
 *
 * The call ends by sending a link, and a link that is never seen to open is an
 * assertion. So the last three beats are the buyer's side of it: the amount
 * already filled in, the method the agent recommended already chosen, and the
 * tick. Greens are the ones sampled off the real Cashfree checkout and shared
 * with `checkout-frames.html` -- header #035D32, secured band #0B6339, ground
 * #F8F7F7, pay bar #1F1E1E -- so this reads as the same product, not a sketch.
 */
.paysheet {
  width: 100%; overflow: hidden;
  border-radius: 18px;
  border: 1px solid rgba(29, 34, 31, 0.13);
  background: #F8F7F7;
  box-shadow: 0 8px 22px rgba(29, 34, 31, 0.09);
}
.paysheet .ps-head { padding: 10px 12px 9px; background: #035D32; color: #fff }
.paysheet .ps-head .r { display: flex; align-items: baseline; gap: 9px }
.paysheet .ps-head .nm {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.paysheet .ps-head .amt {
  margin-left: auto; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.paysheet .ps-head .sub { margin-top: 2px; font-size: 9.5px; color: rgba(255, 255, 255, 0.72) }
.paysheet .ps-sec {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; background: #0B6339; color: rgba(255, 255, 255, 0.86);
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
}
.paysheet .ps-sec svg { width: 9px; height: 9px }
.paysheet .ps-body { padding: 11px 12px 12px }

.paysheet .ps-line {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 9px; border-radius: 11px;
  background: #fff; border: 1px solid rgba(29, 34, 31, 0.09);
}
.paysheet .ps-line .pic {
  flex: none; width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center; background: #F4FCF8; border: 1px solid rgba(3, 93, 50, 0.14);
}
.paysheet .ps-line .pic svg { width: 21px; height: 21px }
.paysheet .ps-line .tx { min-width: 0 }
.paysheet .ps-line .tx b {
  display: block; font-size: 11.5px; font-weight: 700; letter-spacing: -0.015em; color: var(--graphite);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.paysheet .ps-line .tx i {
  display: block; margin-top: 2px; font-style: normal;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(29, 34, 31, 0.46);
}

.paysheet .ps-sum { margin-top: 9px }
.paysheet .ps-sum .r {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 4px 1px; font-size: 11px; color: rgba(29, 34, 31, 0.62);
}
.paysheet .ps-sum .r b { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: rgba(29, 34, 31, 0.85) }
.paysheet .ps-sum .r b.free { color: #0d5f40; letter-spacing: 0.06em }
.paysheet .ps-sum .r.tot {
  margin-top: 3px; padding-top: 7px; border-top: 1px solid rgba(29, 34, 31, 0.1);
  color: var(--graphite); font-weight: 700;
}
.paysheet .ps-sum .r.tot b { font-size: 13px; color: var(--graphite) }

/* the method list. The card that bounced stays on it, greyed, carrying the
   reason -- removing it would hide the whole point of the agent's advice. */
.paysheet .ps-m {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 9px; border-radius: 11px;
  background: #fff; border: 1px solid rgba(29, 34, 31, 0.1);
}
.paysheet .ps-m + .ps-m { margin-top: 6px }
.paysheet .ps-m .ic {
  flex: none; width: 24px; height: 24px; border-radius: 7px;
  display: grid; place-items: center; color: rgba(29, 34, 31, 0.55);
  background: #F8F7F7; border: 1px solid rgba(29, 34, 31, 0.09);
}
.paysheet .ps-m .ic svg { width: 13px; height: 13px }
.paysheet .ps-m .tx { flex: 1; min-width: 0 }
.paysheet .ps-m .tx b { display: block; font-size: 11px; font-weight: 700; letter-spacing: -0.01em; color: var(--graphite) }
.paysheet .ps-m .tx i { display: block; margin-top: 1px; font-style: normal; font-size: 9.5px; color: rgba(29, 34, 31, 0.48) }
.paysheet .ps-m .tx .note { display: block; margin-top: 4px; font-size: 9px; line-height: 1.35 }
.paysheet .ps-m .rd {

}
.paysheet .ps-m.pick { border-color: rgba(3, 93, 50, 0.4); background: #F4FCF8 }
.paysheet .ps-m.pick .ic { color: #035D32; background: #fff; border-color: rgba(3, 93, 50, 0.22) }
.paysheet .ps-m.pick .rd { border-color: #035D32; box-shadow: inset 0 0 0 3px #035D32 }
.paysheet .ps-m.pick .note { color: #0d5f40; font-weight: 600 }
.paysheet .ps-m.off { opacity: 0.62 }
.paysheet .ps-m.off .note { color: #a33232; font-weight: 600 }
.paysheet .ps-m.off .rd { border-style: dashed }

.paysheet .ps-pay {
  margin-top: 11px; padding: 10px; border-radius: 11px;

  font-size: 12px; font-weight: 700; letter-spacing: -0.01em;
}

/* the tick. Bigger than the one on the buyer's order screen, because this is
   the beat the whole run has been walking toward. */
.paysheet .ps-done { padding: 6px 2px 4px; text-align: center }
.paysheet .ps-done .big {
  width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 50%;

  animation: psPop 0.44s cubic-bezier(0.22, 1.4, 0.4, 1) both;

.paysheet .ps-done .big svg { width: 20px; height: 20px }
@keyframes psPop { from { opacity: 0; transform: scale(0.5) } to { opacity: 1; transform: none } }
.paysheet .ps-done .t { font-size: 13px; font-weight: 700; letter-spacing: -0.02em; color: var(--graphite) }
.paysheet .ps-done .amt {
  margin-top: 3px; font-size: 22px; font-weight: 700; letter-spacing: -0.03em;

.paysheet .ps-done .sub {
  margin-top: 7px; font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: rgba(29, 34, 31, 0.42); line-height: 1.5;
}
@media (prefers-reduced-motion: reduce) { .paysheet .ps-done .big { animation: none } }

/* --- 2b. the month at a glance -------------------------------------------
 *
 * Both docs open the same way: the merchant asks what happened this month and
 * "the agent lists failed transactions with reasons for failure". A sentence
 * cannot carry five reasons and five amounts, so that answer is a small table.
 */
.brk {
  width: 100%; padding: 10px 12px 11px;
  border-radius: 16px; background: #fafaf9;
  border: 1px solid rgba(29, 34, 31, 0.11);
}
.brk .bk-top {
  display: flex; align-items: baseline; gap: 8px; padding-bottom: 7px;
  border-bottom: 1px solid rgba(29, 34, 31, 0.08);
}
.brk .bk-top .lbl {
  font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.44);
}
.brk .bk-top .tot {
  margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: rgba(29, 34, 31, 0.5);
}
.brk .bk-row {
  display: grid; grid-template-columns: 5px 1fr auto auto; align-items: center; gap: 8px;
  padding: 6px 0 5px; border-bottom: 1px solid rgba(29, 34, 31, 0.05);

}
.brk .bk-row:last-child { border-bottom: 0; padding-bottom: 0 }
.brk .bk-row .pip { width: 5px; height: 5px; border-radius: 50%; background: rgba(29, 34, 31, 0.2) }

.brk .bk-row .n { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: rgba(29, 34, 31, 0.42) }
.brk .bk-row .v {
