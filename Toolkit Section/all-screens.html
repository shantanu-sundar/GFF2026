  color: var(--graphite); font-variant-numeric: tabular-nums;
}
.brk .bk-row.hot .v { color: #8a5a06 }

/* --- 2c. the approval gate ------------------------------------------------
 *
 * Spark's whole control claim in one card: "Reading is free. Anything that
 * moves money stops and asks." So the refund does NOT happen on the turn the
 * merchant asks for it -- it happens on the turn they say yes, and the card
 * stays in the thread afterwards wearing who approved it. That is also the
 * audit-trail line rendered as an interaction: a person approved it, so a
 * person did it.
 */
.gate {
  width: 100%; padding: 11px 12px 12px;
  border-radius: 16px; background: #fffaf0;
  border: 1px solid rgba(255, 174, 21, 0.34);
  transition: background 0.4s ease, border-color 0.4s ease;
}
.gate .g-top { display: flex; align-items: center; gap: 8px; }
.gate .g-top .lbl {
  font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
  color: #8a5a06;
}
.gate .g-top .tag {
  margin-left: auto; padding: 2px 7px; border-radius: 999px;
  background: rgba(255, 174, 21, 0.18); color: #8a5a06;
  font-size: 9px; font-weight: 600; letter-spacing: 0.02em;
}
.gate .g-amt {
  margin-top: 7px; display: flex; align-items: baseline; gap: 8px;
  font-size: 21px; font-weight: 700; letter-spacing: -0.03em; color: var(--graphite);
  font-variant-numeric: tabular-nums;
}
.gate .g-amt .w { font-size: 11px; font-weight: 400; color: rgba(29, 34, 31, 0.55); letter-spacing: 0; }
.gate .g-rows { margin-top: 9px; display: flex; flex-direction: column; gap: 4px; }
.gate .g-rows span {
  display: flex; align-items: baseline; gap: 8px; font-size: 10.5px;
  padding-bottom: 4px; border-bottom: 1px solid rgba(29, 34, 31, 0.06);
}
.gate .g-rows span:last-child { border-bottom: 0; padding-bottom: 0 }
.gate .g-rows i { font-style: normal; color: rgba(29, 34, 31, 0.5) }
.gate .g-rows b {
  margin-left: auto; font-weight: 500; color: var(--graphite);
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
}
.gate .g-btns { margin-top: 11px; display: flex; gap: 7px; }
.gate .g-btns button {
  appearance: none; border: 0; cursor: default; font: inherit;
  font-size: 11.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
}
.gate .g-btns .yes { background: var(--evergreen); color: #fff; }
.gate .g-btns .no { background: rgba(29, 34, 31, 0.07); color: rgba(29, 34, 31, 0.6); }
.gate .g-done { display: none; margin-top: 10px; align-items: center; gap: 7px; font-size: 10.5px; }
.gate .g-done .tk {
  flex: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--evergreen); display: grid; place-items: center;
}
.gate .g-done .tk svg { width: 8px; height: 8px }
.gate .g-done .who { color: #0d5f40; font-weight: 600 }
.gate .g-done .trail { color: rgba(29, 34, 31, 0.5) }

.gate.ok { background: #f5fbf7; border-color: rgba(0, 173, 108, 0.28); }
.gate.ok .g-top .lbl { color: #0d5f40 }
.gate.ok .g-top .tag { background: rgba(0, 173, 108, 0.14); color: #0d5f40 }
.gate.ok .g-btns { display: none }
.gate.ok .g-done { display: flex }

/* --- 2d. the buyer's WhatsApp --------------------------------------------
 *
 * Segment 3 of the narrative doc is not a Cashfree screen at all: the merchant
 * takes what Spark gave them and tells the customer. Drawn as its own labelled
 * device for the same reason as the buyer's screen -- so it can never be
 * misread as the merchant's phone.
 */
.wa {
  width: 100%; overflow: hidden;
  border-radius: 18px;
  border: 1px solid rgba(29, 34, 31, 0.13);
  background: #ece5dd;
  box-shadow: 0 10px 24px rgba(29, 34, 31, 0.09);
}
.wa .wa-tag {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 11px; background: rgba(29, 34, 31, 0.055);
  font-size: 9px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.5);
}
.wa .wa-tag .live {
  width: 5px; height: 5px; border-radius: 50%; background: var(--evergreen);
}
.wa .wa-top {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px; background: #0f5c50; color: #fff;
}
.wa .wa-top .av {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.22); display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
}
.wa .wa-top .nm { display: block; font-size: 12px; font-weight: 600; letter-spacing: -0.01em }
.wa .wa-top .st { display: block; font-size: 9px; color: rgba(255, 255, 255, 0.7) }
.wa .wa-body { padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 6px }
.wa .wb {
  max-width: 84%; padding: 7px 9px 5px; border-radius: 10px;
  font-size: 11px; line-height: 1.42; color: var(--graphite);
  box-shadow: 0 1px 1px rgba(29, 34, 31, 0.11);
  position: relative;
}
.wa .wb.out { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 3px }
.wa .wb.in { align-self: flex-start; background: #fff; border-top-left-radius: 3px }
.wa .wb .t { display: block; text-align: right; margin-top: 2px; font-size: 8.5px; color: rgba(29, 34, 31, 0.42) }
.wa .wb .t .rr { color: #34b7f1; font-weight: 700; letter-spacing: -0.1em }
.wa .wlink {
  display: block; margin-bottom: 5px; padding: 7px 8px; border-radius: 7px;
  background: rgba(255, 255, 255, 0.72);
}
.wa .wlink .lt { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600 }
.wa .wlink .lt .cfl { flex: none; width: 14px; height: 14px }
.wa .wlink .lu {
  display: block; margin-top: 2px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(29, 34, 31, 0.5);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* --- 3. Relay Calling ----------------------------------------------------- */

.callscene {
  position: absolute; inset: 0; z-index: 13;
  overflow: hidden;
  background: #06080a; color: #f4f5f4;
  display: flex; flex-direction: column;
  padding: 50px 16px 18px;
  animation: callIn 0.44s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.callscene.gone { animation: callOut 0.4s ease both }

/* --- the buyer's own phone, taking the screen ----------------------------- *
 *
 * Segment 3 ends with a link, and what happens next happens on HER phone, in
 * a Cashfree checkout, with Relay nowhere in it. Drawn in the thread it would
 * have read as one more thing the agent said; the whole claim is that the
 * agent handed off and the buyer finished on her own. So it takes the screen
 * the way the call does, and drops back into the chat when she is done.
 *
 * Same chassis as .callscene on purpose: a full-bleed dark stage with one card
 * on it, so the hand-off from the call to the checkout reads as one continuous
 * move off the merchant's phone rather than as two unrelated set pieces.
 */
.paycast {
  position: absolute; inset: 0; z-index: 13;
  overflow: hidden;
  background: #06080a; color: #f4f5f4;
  display: flex; flex-direction: column; align-items: center;
  padding: 46px 14px 18px;
  animation: callIn 0.44s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.paycast.gone { animation: callOut 0.4s ease both }
.paycast .pc-top {
  flex: none; display: flex; align-items: center; gap: 7px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
  color: rgba(244, 245, 244, 0.62);
}
.paycast .pc-top .live {
  width: 5px; height: 5px; border-radius: 50%; background: #10ab50;
  box-shadow: 0 0 0 0 rgba(16, 171, 80, 0.5);
  animation: recpulse 1.6s ease-in-out infinite;
}
/* the link the call produced, sitting on her phone waiting to be opened */
.paycast .pc-link {
  margin-top: 14px; width: 100%;
  padding: 10px 11px; border-radius: 12px;
  background: rgba(244, 245, 244, 0.06);
  border: 1px solid rgba(244, 245, 244, 0.13);
  display: flex; align-items: center; gap: 9px;
}
.paycast .pc-link .cfl { width: 15px; height: 15px; flex: none }
.paycast .pc-link .tx { min-width: 0; flex: 1 }
.paycast .pc-link .tx b {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
  color: #f4f5f4;
}
.paycast .pc-link .tx i {
  display: block; margin-top: 1px; font-style: normal;
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
  color: rgba(244, 245, 244, 0.44);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.paycast .pc-link .go {
  flex: none; padding: 5px 9px; border-radius: 999px;
  background: #f4f5f4; color: #06080a;
  font-size: 9.5px; font-weight: 700;
}
.paycast .pc-stage { margin-top: 13px; width: 100%; }
.paycast .pc-stage .paysheet {
  animation: sheetUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.paycast .pc-foot {
  margin-top: auto; padding-top: 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
  color: rgba(244, 245, 244, 0.34);
}
/* a screen cast hosts the buyer's own app rather than a checkout sheet.
   The stage is dark and sets a near-white `color`; .buyscr is a white card that
   never declared its own, so anything in it without an explicit colour (the
   push title, the head line) inherited the stage's and went invisible. */
.paycast .pc-stage .buyscr {
  color: var(--graphite);
  animation: sheetUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.paycast .pc-stage .paysheet { color: var(--graphite) }
.paycast.plain { justify-content: flex-start }

/* The push, as one actually arrives: a banner off the TOP of the phone, over
   whatever is on screen, wearing the face of the agent that sent it. Drawn in
   the page flow it would have been a card about a notification; the whole
   point of this beat is that it interrupts her the moment the money lands. */
.paycast .pc-push {
  /* below the back chevron and the whose-phone tag, both of which float
     above the stage: at the very top the banner landed underneath the
     chevron and swallowed the tag. */
  position: absolute; top: 76px; left: 12px; right: 12px; z-index: 9;
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px; border-radius: 15px;
  background: rgba(255, 255, 255, 0.97);
  border: 1px solid rgba(29, 34, 31, 0.08);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
  animation: pushIn 0.52s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes pushIn {
  from { opacity: 0; transform: translateY(-22px) scale(0.97) }
  to   { opacity: 1; transform: none }
}
@media (prefers-reduced-motion: reduce) { .paycast .pc-push { animation: none } }
.paycast .pc-push .orb { --o: 26px; flex: none }
.paycast .pc-push .tx { min-width: 0; flex: 1 }
.paycast .pc-push .nt {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.42);
}
.paycast .pc-push .nt .when { margin-left: auto; letter-spacing: 0.02em; text-transform: none }
.paycast .pc-push .nh {
  display: block; margin-top: 3px;
  font-size: 12px; font-weight: 700; letter-spacing: -0.015em; color: var(--graphite);
}
.paycast .pc-push .nb {
  display: block; margin-top: 2px;
  font-size: 10.5px; line-height: 1.4; color: rgba(29, 34, 31, 0.6);
}

/* Cashfree's loader with the whole phone, rather than a card on a dark stage.
   This is what the buyer actually sees: whatever page she was on is gone and
   the drop-in owns the screen until it comes back with an answer. Same asset
   and same note as the Skills store shows, at the size that store shows it. */
.paycast.cffull > .pc-top,
.paycast.cffull > .pc-link,
.paycast.cffull > .pc-foot,
.paycast.cffull > .pc-call { opacity: 0; transition: opacity 0.24s ease }
.paycast.cffull .pc-stage { position: absolute; inset: 0; margin: 0; display: block }
.paycast.cffull .pc-cf {
  position: absolute; inset: 0; margin: 0; padding: 0;
  background: #fdfdfd;
  justify-content: center; gap: 26px;
}
.paycast.cffull .pc-cf .cf-load {
  padding: 0; border-radius: 0; box-shadow: none; background: transparent;
}
.paycast.cffull .pc-cf .lgif { width: 62%; border-radius: 0 }
.paycast.cffull .pc-cf .cf-pay {
  background: #fff; border: 1px solid rgba(17, 24, 39, 0.1); color: #111827;
}

/* The call did not end when the checkout opened: she is paying with the agent
   still on the line. A hung-up call and a checkout in sequence would be two
   separate events; this is one. */
.paycast .pc-call {
  flex: none; margin-top: 10px; width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 999px;
  background: rgba(16, 171, 80, 0.11);
  border: 1px solid rgba(16, 171, 80, 0.24);
}
.paycast .pc-call .orb { --o: 17px; flex: none }
.paycast .pc-call .t {
  flex: 1; min-width: 0; font-size: 10.5px; font-weight: 600; color: #b7f0cd;
}
.paycast .pc-call .dur {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(183, 240, 205, 0.72);
}
.paycast .pc-call .bars { display: flex; align-items: flex-end; gap: 1.5px; height: 11px }
.paycast .pc-call .bars i {
  width: 2px; border-radius: 1px; background: #10ab50;
  transform-origin: bottom;
  animation: pcbar 0.9s ease-in-out infinite;
}
/* its own keyframe rather than .vcap's `vbar`: that one animates height between
   16px and a --h the caller sets, which would burst an 11px strip. */
@keyframes pcbar { 0%, 100% { transform: scaleY(0.4) } 50% { transform: scaleY(1) } }
@media (prefers-reduced-motion: reduce) { .paycast .pc-call .bars i { animation: none } }

/* A checkout is a PAGE on her phone, not a card floating in the middle of a
   dark stage with half the screen left empty under it. So the sheet grows to
   the bottom edge, its Pay button sits on that edge the way every checkout's
   does, and the tick centres in the space instead of clinging to the top.
   The screen cast is exempt: that one is showing an app that has its own
   shape and would only be stretched out of it. */

/* An app on somebody's phone is not a card floating on a dark ground with the
   phone's own edges showing round it -- it IS the screen. So a cast goes EDGE
   TO EDGE: no padding, no radius, no border, no shadow. What is left of the
   dark stage is a slim header strip carrying the label that says whose phone
   this is, the link when there is one, and the on-the-call chip. That header
   is the one part that has to survive: the entire point of a cast is that the
   screen under it is not the merchant's. */
.paycast { padding: 0 }
.paycast .pc-head {
  flex: none; width: 100%;
  /* 50 + the label + 12 clears the back button, which is absolutely positioned
     at top 44 and 30 tall and would otherwise sit on the store's brand bar */
  padding: 50px 14px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  background: #06080a;
}
.paycast .pc-top { justify-content: center }
.paycast .pc-link, .paycast .pc-call { margin-top: 0 }

.paycast .pc-stage { margin-top: 0; flex: 1; min-height: 0; display: flex; width: 100% }
.paycast .pc-stage > .buyscr,
.paycast .pc-stage > .paysheet {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  border: 0; border-radius: 0; box-shadow: none;
}
.paycast .pc-stage > .buyscr .bs-body,
.paycast .pc-stage > .paysheet .ps-body {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
}
.paycast .pc-stage > .buyscr .bs-cta,
.paycast .pc-stage > .paysheet .ps-pay { margin-top: auto }
.paycast .pc-stage > .buyscr .bs-meta { flex: none }
.paycast .pc-stage > .paysheet .ps-done { margin: auto 0 }
/* the message she gets after paying, on the same phone */
/* UNUSED. No cast passes `link` any more -- all three agents drop it, because
   the first sheet paints on mount and the strip therefore lands ON the checkout
   it opened rather than before it. Kept, with `.pc-link` above, as the recipe
   if a beat ever does want to show a link arriving on its own screen; if you
   reach for it, give it a beat where nothing else is painted. */
.paycast.opened .pc-link, .paycast.msgd .pc-link { display: none }
.paycast .pc-stage > .wa {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  border: 0; border-radius: 0; box-shadow: none;
}
.paycast .pc-stage > .wa .wa-top { padding: 11px 13px }
.paycast .pc-stage > .wa .wa-body { flex: 1; min-height: 0; padding: 13px 12px; gap: 8px }
.paycast .pc-stage > .wa .wb { max-width: 88%; font-size: 12px; padding: 9px 11px 6px }
.paycast .pc-stage > .wa .wb .t { font-size: 9px }

/* whose phone it is now reads off the header, so a builder's own tag would be
   the same sentence twice */
.paycast .pc-stage > .buyscr .bs-tag,
.paycast .pc-stage > .paysheet .bs-tag { display: none }
.paycast .pc-foot { display: none }

/* Cashfree's loader, taking the whole phone.
 *
 * In the real thing the merchant's site hands off and the browser sits on
 * Cashfree's own page until it hands back, so this is not a card on a stage --
 * it covers the screen, the link row and the tag included, and lifts when the
 * receipt arrives. */
.paycast .pc-cf {
  position: absolute; inset: 0; z-index: 5;
  background: #fdfdfd;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px;
  animation: cfFade 0.28s ease both;
}
@keyframes cfFade { from { opacity: 0 } to { opacity: 1 } }
.paycast .pc-cf .cf-load,
.paycast .pc-cf .cf-pay {
  position: static; inset: auto; opacity: 1; transform: none; pointer-events: auto;
}
.paycast .pc-cf .cf-load {
  background: none; box-shadow: none; border-radius: 0; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.paycast .pc-cf .lgif { width: 232px; height: auto; display: block }
.paycast .pc-cf .lnote { font-size: 10px; color: #9ca3af }
/* light chrome, because the ground under it is Cashfree's white page now */
.paycast .pc-cf .cf-pay {
  display: flex; flex-direction: row; align-items: center; gap: 9px;
  padding: 9px 15px; border-radius: 999px;
  background: #f3f4f6; border: 1px solid rgba(17, 24, 39, 0.08);
  color: #111827; font-size: 11.5px; font-weight: 600;
}

@media (prefers-reduced-motion: reduce) {
  .paycast, .paycast .pc-stage .paysheet,
  .paycast .pc-stage .buyscr, .paycast .pc-cf { animation: none }
}

/* --- the agent catching it ------------------------------------------------ *
 *
 * The trigger firing, on the AGENT's side. Every other screen in this segment
 * belongs to the buyer; this one belongs to Relay, and it is the only card in
 * the run that offers an action rather than reporting one, because a recovery
 * agent that noticed and did nothing would just be a dashboard.
 */
.detect {
  width: 100%;
  padding: 11px 12px 12px;
  border-radius: 15px;
  background: #fff;
  border: 1px solid rgba(214, 69, 69, 0.24);
  box-shadow: 0 2px 10px rgba(29, 34, 31, 0.06);
}
.detect .dt-top {
  display: flex; align-items: center; gap: 7px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: #b03636;
}
.detect .dt-top .pip {
  width: 6px; height: 6px; border-radius: 50%; background: #d64545;
  box-shadow: 0 0 0 0 rgba(214, 69, 69, 0.5);
  animation: recpulse 1.6s ease-in-out infinite;
}
.detect .dt-h {
  margin-top: 7px;
  font-size: 14.5px; font-weight: 700; letter-spacing: -0.025em; color: var(--graphite);
}
.detect .dt-rows { margin-top: 9px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px }
.detect .dt-rows span { display: block; min-width: 0 }
.detect .dt-rows i {
  display: block; font-style: normal;
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.4);
}
.detect .dt-rows b {
  display: block; margin-top: 1px;
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500;
  color: var(--graphite);
}
.detect .dt-rows span.wide { grid-column: 1 / -1 }
.detect .dt-rows span.wide b { font-family: inherit; font-size: 11px; line-height: 1.4 }
.detect .dt-cta {
  margin-top: 11px; padding: 9px;
  border-radius: 10px;
  background: var(--evergreen); color: #fff;
  font-size: 11.5px; font-weight: 700; letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.detect .dt-cta svg { width: 13px; height: 13px }
@keyframes callIn  { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
@keyframes callOut { to { opacity: 0; transform: scale(1.03); filter: blur(6px) } }

/* the agent's own colour bleeds in from the top, so a call always looks like
   it came from the agent you were just watching */
.callscene::before {
  content: ''; position: absolute; left: -30%; right: -30%; top: -34%; height: 74%;
  background: radial-gradient(58% 58% at 50% 62%, var(--glow, #10ab50) 0%, transparent 72%);
  opacity: 0.3; filter: blur(26px); pointer-events: none;
}

.callscene .chead { position: relative; z-index: 2; text-align: center }
.callscene .ckick {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(244, 245, 244, 0.42);
}
.callscene .cstat {
  margin-top: 5px; font-size: 14px; font-weight: 700; letter-spacing: -0.015em;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.callscene .cstat .t { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(244, 245, 244, 0.5) }
.callscene .clang {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em;
  color: rgba(244, 245, 244, 0.62);
  background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12);
}

/* the pair */
.callscene .cpair {
  position: relative; z-index: 2;
  margin: 18px 0 2px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px;
}
.callscene .cnode { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0 }
.callscene .cnode .nm {
  font-size: 11px; font-weight: 700; letter-spacing: -0.01em; text-align: center;
  max-width: 12ch; line-height: 1.25;
  /* two lines' worth either way, so "Payment Recovery" wrapping does not drop
     its number a line below the buyer's */
  min-height: 28px;
}
.callscene .cnode .cwho {
  /* NB: not .sub -- that is the section subtitle up top, and it carries an
     18px margin that would push this off the node. */
  margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: rgba(244, 245, 244, 0.4);
}
.callscene .cnode .orb { --o: 58px; outline: none }
.callscene .cava {
  position: relative; width: 58px; height: 58px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: #10321a;
  background: linear-gradient(150deg, #dff3c4 0%, #b6ddb0 100%);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
}
/* the halo marks whoever is talking; while it rings, it pulses on the agent */
.callscene .halo {
  position: absolute; inset: -9px; border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.4);
  opacity: 0; pointer-events: none;
}
.callscene .cshell { position: relative; display: grid; place-items: center }
.callscene.ringing .cshell.a .halo,
.callscene.side-a .cshell.a .halo,
.callscene.side-b .cshell.b .halo { opacity: 1; animation: halo 1.5s ease-out infinite }
@keyframes halo {
  0%   { transform: scale(0.9); opacity: 0.85 }
  100% { transform: scale(1.42); opacity: 0 }
}

/* the line between them: a flat dotted rule while it rings, a live meter once
   it connects, leaning toward whoever holds the floor */
.callscene .cwire { display: flex; align-items: center; gap: 3px; height: 46px; padding: 0 2px }
.callscene .cwire i {
  display: block; width: 2.5px; border-radius: 3px; height: 4px;
  background: rgba(255, 255, 255, 0.24);
  transition: background 0.3s ease;
}
.callscene.live .cwire i { animation: cw 0.8s ease-in-out infinite; background: rgba(255, 255, 255, 0.6) }
.callscene.side-a .cwire i:nth-child(-n+6),
.callscene.side-b .cwire i:nth-child(n+10) { background: #fff }
@keyframes cw { 0%, 100% { height: 4px } 50% { height: var(--h, 20px) } }

/* the transcript. One line at a time, so it reads at video speed. */
.callscene .csub {
  position: relative; z-index: 2;
  flex: 1; min-height: 0; margin-top: 8px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 7px;
  overflow: hidden;
}
.callscene .cline {
  padding: 8px 11px; border-radius: 14px;
  font-size: 12px; line-height: 1.42;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.11);
  animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.callscene .cline .who {
  display: block; margin-bottom: 3px;
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(244, 245, 244, 0.42);
}
.callscene .cline.b { background: rgba(206, 249, 147, 0.12); border-color: rgba(206, 249, 147, 0.22) }
.callscene .cline.b .who { color: rgba(206, 249, 147, 0.7) }

/* what the call actually produced */
.callscene .cres {
  position: relative; z-index: 2;
  margin-top: 9px;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px; border-radius: 14px;
  background: rgba(0, 173, 108, 0.16);
  border: 1px solid rgba(0, 173, 108, 0.3);
  font-size: 11.5px; font-weight: 600;
  animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.callscene .cres .amt { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 500 }
.callscene .cres .tick { width: 16px; height: 16px }

/* hang up */
.callscene .cend {
  position: relative; z-index: 2;
  margin: 10px auto 0; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: #e0483f; box-shadow: 0 8px 20px rgba(224, 72, 63, 0.4);
}
.callscene .cend svg { width: 16px; height: 16px }
@media (prefers-reduced-motion: reduce) {
  .callscene .cwire i, .callscene .halo { animation: none }
}

/* ---------------- connect screen ---------------- */

/*
 * Every demo opens by showing what is plugging into what — the host on the
 * left, the Cashfree surface on the right, a link that fills between them and
 * a switch that throws. Without it the chat just starts and you have to take
 * on faith that anything is actually wired up.
 */
.connect {
  position: absolute; inset: 0; z-index: 11;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 40px 22px;
  transition: opacity 0.42s ease, filter 0.42s ease, transform 0.42s ease;
}
.connect.gone { opacity: 0; filter: blur(12px); transform: scale(1.04); pointer-events: none; }

.cx-pair { display: flex; align-items: center; gap: 0; }
.cx-node { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 84px; }
.cx-node .tile {
  width: 52px; height: 52px; border-radius: 16px;
  display: grid; place-items: center;
  background: #fff;
  border: 1px solid rgba(29,34,31,0.12);
  box-shadow: 0 3px 12px rgba(29,34,31,0.09);
}
.cx-node .tile svg { width: 24px; height: 24px; }
.cx-node .nm {
  font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.25;
  color: var(--graphite);
}

/* the link that fills between the two */
.cx-wire { position: relative; width: 62px; height: 2px; background: rgba(29,34,31,0.14); border-radius: 2px; }
.cx-wire .fill {
  position: absolute; inset: 0; width: 0;
  background: var(--evergreen);
  border-radius: 2px;
  transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}
.connect.live .cx-wire .fill { width: 100%; }
.cx-wire .bead {
  position: absolute; top: 50%; left: 0;
  width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
  border-radius: 50%; background: var(--evergreen);
  box-shadow: 0 0 0 4px rgba(0,173,108,0.18);
  opacity: 0;
}
.connect.live .cx-wire .bead { animation: bead 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes bead {
  0% { left: 0; opacity: 1; }
  85% { opacity: 1; }
  100% { left: 100%; opacity: 0; }
}

.cx-via {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: rgba(29,34,31,0.5); text-align: center;
  max-width: 250px; word-break: break-all;
}

/* the switch you watch throw */
.cx-switch {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 13px 9px 11px; border-radius: 999px;
  background: #fff;
  border: 1px solid rgba(29,34,31,0.12);
  box-shadow: 0 3px 12px rgba(29,34,31,0.08);
}
.cx-switch .track {
  position: relative; width: 40px; height: 23px; border-radius: 999px;
  background: rgba(29,34,31,0.18);
  transition: background 0.34s ease;
}
.cx-switch .knob {
  position: absolute; top: 2.5px; left: 2.5px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.24);
  transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.connect.live .cx-switch .track { background: var(--evergreen); }
.connect.live .cx-switch .knob { transform: translateX(17px); }
.cx-switch .lbl { font-size: 13px; font-weight: 600; color: var(--graphite); }

.cx-status {
  font-size: 12.5px; color: rgba(29,34,31,0.55);
  text-align: center; line-height: 1.4; min-height: 34px;
  max-width: 240px;
}
.cx-status .ok { color: #04663f; font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .cx-wire .fill { transition: none; }
  .connect.live .cx-wire .bead { animation: none; }
}

/* ---------------- tap-to-advance (Figma-prototype behaviour) ---------------- */

/* The phone itself is the control — clicking the screen advances a step, the way
   tapping a frame in a Figma prototype moves to the next one. The buttons stay
   for keyboard and for anyone who does not think to try the device. */
.screen.tappable { cursor: pointer; }
.screen.tappable:active { transform: scale(0.997); }

.ripple {
  position: absolute;
  z-index: 8;
  width: 12px; height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: rgba(0, 173, 108, 0.34);
  pointer-events: none;
  animation: ripple 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes ripple {
  from { transform: scale(1); opacity: 0.85; }
  to   { transform: scale(13); opacity: 0; }
}

/* A quiet pulse on the device before anyone has touched it. */
.taphint {
  position: absolute;
  left: 50%; top: 42%; transform: translate(-50%, -50%);
  z-index: 7;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12px; font-weight: 500;
  color: rgba(29,34,31,0.7);
  background: #fff;
  border: 1px solid rgba(29,34,31,0.12);
  box-shadow: 0 3px 12px rgba(29,34,31,0.10);
  pointer-events: none;
  animation: hintpulse 2.1s ease-in-out infinite;
}
@keyframes hintpulse {
  0%, 100% { opacity: 0.66; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 1;    transform: translate(-50%, -52%) scale(1.03); }
}
.taphint .ring {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--evergreen);
}

/* Step entrance with a bit more travel, so an advance reads as a transition
   rather than a list quietly growing. */
@keyframes rise {
  from { opacity: 0; transform: translateY(16px) scale(0.985); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}

@media (prefers-reduced-motion: reduce) {
  .ripple, .taphint { animation: none !important; }
  .ripple { display: none; }
}

.dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
.dots i {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.2); cursor: pointer; transition: all 0.25s ease;
}
.dots i.on { background: var(--evergreen); width: 20px; border-radius: 999px; }


/* ---------------- the Skills chassis + terminal surface ----------------
 *
 * Agent Skills used to widen the phone into a laptop, because you run the
 * command in a repo rather than on a handset. The booth killed that: a booth
 * display IS a 360x800 portrait screen, so the terminal was already designed
 * to stack -- title bar, transcript, workspace, prompt -- and that stacked
 * portrait design is the one that shipped. The page now shows the SAME thing:
 * one design, one set of rules, whether it runs on a kiosk or in this card.
 *
 * So the device stays a phone; it only grows to hold the booth screen exactly.
 * 382 x 822 outside, minus the 11px bezel, is 360 x 800 inside -- byte-for-byte
 * the frame the booth renders, so every store and checkout rule below is shared
 * rather than duplicated per surface. Same .screen element throughout, so
 * tap-to-advance, the dots, the tour and the connect screen keep working.
 */

/* The slot keeps the phone's height across demos, so opening Skills never
   reflows the card underneath it. */
.phone-wrap { min-height: 722px; justify-content: center; }

.phone {
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1),
              height 0.5s cubic-bezier(0.22, 1, 0.36, 1),
              border-radius 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.demo { transition: grid-template-columns 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
/* the phone column widens by exactly what the taller phone needs */
.demo.wide { grid-template-columns: 1fr 414px; }

.phone.as-term {
  width: 382px;
  height: 822px;
}
/* No notch: the terminal brings its own title bar, and the booth screen this
   is a copy of has neither. A notch here would sit on the traffic lights. */
.phone.as-term .notch { display: none; }

/* --- the terminal screen ---
 *
 * Light, not dark. A terminal is legible on paper as long as the grammar is
 * intact -- traffic lights, mono, a $ prompt, tool lines -- and a light ground
 * keeps this demo inside the same warm liquid-glass world as the rest of the
 * section instead of reading as a hole cut in the page.
 */
.screen.term {
  background:
    radial-gradient(120% 90% at 4% 0%, rgba(206, 249, 147, 0.28) 0%, rgba(206, 249, 147, 0) 52%),
    radial-gradient(110% 85% at 100% 100%, rgba(255, 174, 21, 0.2) 0%, rgba(255, 174, 21, 0) 58%),
    linear-gradient(150deg, #fcfbf6 0%, #faf7f0 54%, #fdf6e9 100%);
  color: var(--graphite);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* Portrait, because the screen is portrait everywhere now: title bar, then
     the transcript, then the workspace it wrote, then the prompt. The file
     rail beside the transcript was a landscape-lid idea and went with the lid. */
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto minmax(0, 1fr) minmax(0, auto) auto;
  grid-template-areas:
    "top"
    "thread"
    "panel"
    "composer";
}
.screen.term .ph-top   { grid-area: top; }
.screen.term .ledger   { grid-area: panel; }
.screen.term .thread   { grid-area: thread; }
.screen.term .composer { grid-area: composer; }
/* the blueprint grid is already dark-on-light; just keep it a whisper */
.screen.term::before { opacity: 0.5; }

/* window title bar */
.screen.term .ph-top {
  padding: 9px 12px 9px 48px;
  gap: 8px;
  border-bottom: 1px solid rgba(29, 34, 31, 0.09);
  background: rgba(255, 255, 255, 0.62);
}
.tlights { display: inline-flex; gap: 5px; align-items: center; margin-right: 3px; }
.tlights i { width: 8px; height: 8px; border-radius: 50%; background: #d6d3cc; }
.tlights i:nth-child(1) { background: #ec6a5e; }
.tlights i:nth-child(2) { background: #f4bf4f; }
.tlights i:nth-child(3) { background: #61c554; }
.screen.term .chip {
  background: rgba(255, 255, 255, 0.86);
  border-color: rgba(255, 255, 255, 0.95);
  color: rgba(29, 34, 31, 0.62);
  box-shadow: 0 3px 10px rgba(29, 34, 31, 0.06);
}
.screen.term .backbtn { top: 10px; left: 12px; width: 28px; height: 28px; }

/* transcript */
.screen.term .thread {
  padding: 11px 14px 9px;
  gap: 2px;
  font-size: 11.5px;
  line-height: 1.55;
  min-width: 0;   /* grid items default to min-width:auto */
}
.tline { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
.tline.in { color: var(--graphite); font-weight: 500; }
.tline .p { color: var(--evergreen); font-weight: 700; margin-right: 7px; }
.tline.ok { color: rgba(29, 34, 31, 0.72); }
.tline.dim { color: rgba(29, 34, 31, 0.42); }
.tk { width: 10px; height: 10px; vertical-align: -1px; margin-right: 6px; color: var(--evergreen); }
.tcall { display: flex; align-items: center; gap: 8px; color: var(--graphite); padding-top: 3px; }
.tcall .bul { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--evergreen); }
.tcall .fn { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcall .ms { margin-left: auto; color: rgba(29, 34, 31, 0.34); font-size: 10.5px; }
.tres { display: block; padding-left: 14px; color: rgba(29, 34, 31, 0.55); }
.tres .br { color: rgba(29, 34, 31, 0.28); margin-right: 6px; }
.tsay {
  display: block; padding: 5px 0 3px;
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  font-size: 11.5px; line-height: 1.5;
  color: rgba(29, 34, 31, 0.78);
}
/* the installer's own banner -- ANSI shadow art, chalk's own two hexes.
   Sized so all 73 columns clear the transcript width. */
.tbanner {
  margin: 4px 0 2px;
  font-size: 8px;
  line-height: 1.03;
  white-space: pre;
  overflow: hidden;
}
.tbanner .g { color: #10b981; font-weight: 700; }
.tbanner .a { color: #f59e0b; font-weight: 700; }
.tsetup { display: block; color: #0e7490; font-weight: 700; padding: 3px 0 2px; }

/* the inquirer checkbox prompt */
.tq { display: block; color: var(--graphite); font-weight: 500; }
.tq .qm { color: var(--evergreen); font-weight: 700; margin-right: 6px; }
.thint { display: block; color: rgba(29, 34, 31, 0.38); padding-bottom: 2px; }
.thint b { color: rgba(29, 34, 31, 0.55); font-weight: 500; }
.topt { display: block; color: rgba(29, 34, 31, 0.6); padding-left: 12px; }
.topt .mk { margin-right: 7px; }
.topt.on { color: #0e7490; font-weight: 700; padding-left: 0; }
.topt.on .ptr { color: #0e7490; margin-right: 2px; }

/* the installed skill tree */
.ttree { display: block; color: rgba(29, 34, 31, 0.5); white-space: pre; }
.ttree .hi { color: rgba(29, 34, 31, 0.78); }

/* CLAUDE.md's routing table, drawn rather than described.
 *
 * "CLAUDE.md is the routing table" was a sentence in the voiceover, which is
 * the weakest way to make the claim -- the whole point is that a question on
 * the left lands on a file on the right without the merchant choosing it. So
 * it is a table with arrows, shown once, on the beat where Claude picks the
 * file up. The left column is fixed-width so all four arrows line up into one
 * column: a ragged arrow reads as four statements, an aligned one reads as a
 * mechanism. 106 + 20 + the longest path still clears the 360px transcript
 * booth mode gives it.
 */
.troute {
  margin: 5px 0 3px;
  border: 1px solid rgba(29, 34, 31, 0.1);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.78);
  box-shadow: 0 5px 16px rgba(29, 34, 31, 0.05);
  overflow: hidden;
}
.troute .hd {
  display: flex; align-items: baseline; gap: 7px;
  padding: 4px 10px;
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.36);
  border-bottom: 1px solid rgba(29, 34, 31, 0.08);
}
.troute .hd b {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0;
  text-transform: none; color: var(--evergreen);
}
.troute .rw {
  display: grid;
  grid-template-columns: 106px 20px 1fr;
  align-items: center;
  padding: 3.5px 10px;
  font-size: 10.5px; line-height: 1.45;
}
.troute .rw + .rw { border-top: 1px dashed rgba(29, 34, 31, 0.07); }
.troute .q  { color: rgba(29, 34, 31, 0.5); }
.troute .ar { color: var(--evergreen); font-weight: 700; text-align: center; }
.troute .to { color: rgba(29, 34, 31, 0.82); font-weight: 500; }

/* the payoff: skills generate code, so the code shows up on screen */
.tcode {
  margin: 6px 0 3px;
  border: 1px solid rgba(29, 34, 31, 0.1);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.78);
  box-shadow: 0 5px 16px rgba(29, 34, 31, 0.05);
  overflow: hidden;
}
.tcode .hd {
  padding: 4px 10px;
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(29, 34, 31, 0.36);
  border-bottom: 1px solid rgba(29, 34, 31, 0.08);
}
.tcode pre { margin: 0; padding: 8px 10px; font: inherit; font-size: 11px; line-height: 1.55; white-space: pre-wrap; }
.tcode .k { color: #0a7a4d; }
.tcode .s { color: #a86a00; }
.tcode .n { color: #0f6a86; }
.tcode .c { color: rgba(29, 34, 31, 0.38); }

/* the workspace strip: what got written, what it is reading */
.screen.term .ledger {
  margin: 0;
  padding: 9px 12px 10px;
  border-radius: 0;
  border: 0;
  border-top: 1px solid rgba(29, 34, 31, 0.09);
  background: rgba(255, 255, 255, 0.5);
  box-shadow: none;
  min-width: 0;
  overflow: hidden;
}
.screen.term .ledger .lbl { color: rgba(29, 34, 31, 0.4); }
.screen.term .ledger .net {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 500; letter-spacing: 0;
  color: var(--evergreen);
}
.screen.term .ledger .rows { grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
.screen.term .lrow {
  grid-template-columns: 6px 1fr;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: rgba(29, 34, 31, 0.42);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.screen.term .lrow .pip { background: rgba(29, 34, 31, 0.17); }
.screen.term .lrow.on { color: rgba(29, 34, 31, 0.8); }
.screen.term .lrow .v { font-size: 9.5px; font-weight: 400; color: rgba(29, 34, 31, 0.38); }
.screen.term .lrow.on .v { color: var(--evergreen); }
/* the summary row sits under the files, not among them */
.screen.term .lrow.sum {
  margin-top: 4px; padding-top: 9px;
  border-top: 1px solid rgba(29, 34, 31, 0.09);
}

/* prompt line */
.screen.term .composer {
  margin: 0;
  padding: 10px 14px 12px;
  border-radius: 0;
  border: 0;
  border-top: 1px solid rgba(29, 34, 31, 0.09);
  background: rgba(255, 255, 255, 0.62);
  box-shadow: none;
  font-size: 11.5px;
  gap: 7px;
}
.screen.term .composer::before {
  content: attr(data-p);
  color: var(--evergreen);
  font-weight: 700;
}
.screen.term .composer .txt { color: var(--graphite); }
.screen.term .composer .txt.ph { color: rgba(29, 34, 31, 0.36); }
.screen.term .send { display: none; }

/* ---------------- the storefront outro ----------------
 *
 * The script ends on the browser, not the terminal: "Visual: Website check out
 * - payments." So the last beat lifts a browser over the whole laptop screen --
 * the store the assistant just wired up, taking a payment. Deliberately a plain
 * demo store: no third-party storefront branding on a Cashfree asset.
 */
.store {
  position: absolute; inset: 0; z-index: 8;
  display: flex; flex-direction: column;
  background: #f3f1ec;
  opacity: 0; transform: scale(1.02);
  transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}
.store.live { opacity: 1; transform: none; }

.st-chrome {
  flex: none;
  display: flex; align-items: center; gap: 9px;
  padding: 8px 12px 8px 48px;
  background: #e6e3dc;
  border-bottom: 1px solid rgba(29, 34, 31, 0.1);
}
.st-url {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: rgba(29, 34, 31, 0.5);
  background: #fbfaf7;
  border: 1px solid rgba(29, 34, 31, 0.08);
  border-radius: 999px;
  padding: 4px 12px;
}
.st-url .lock { color: var(--evergreen); margin-right: 5px; }

.st-body {
  flex: 1; min-height: 0; background: #ffffff;
  display: flex; flex-direction: column; position: relative;
  overflow: hidden;   /* a tall view clips, it never pushes the caption out */
}
.st-nav {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px;
  border-bottom: 1px solid rgba(17, 24, 39, 0.08);
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
}
.st-logo {
  width: 20px; height: 20px; border-radius: 6px;
  background: linear-gradient(140deg, #6366f1, #7c3aed);
  display: grid; place-items: center;
}
.st-logo svg { width: 11px; height: 11px; color: #fff; }
.st-brand { font-size: 13px; font-weight: 700; letter-spacing: -0.02em; color: #111827; }
.st-brand .thin { color: #4f46e5; }
.st-links { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 9.5px; color: #6b7280; }
.st-links span { padding: 4px 8px; border-radius: 7px; }
.st-links span.on { background: #4f46e5; color: #fff; font-weight: 700; }
.st-av {
  width: 18px; height: 18px; border-radius: 50%;
  background: linear-gradient(140deg, #6366f1, #7c3aed);
  color: #fff; font-size: 7.5px; font-weight: 700;
  display: grid; place-items: center;
}

/* --- view 1: the collection --- */
.st-head { flex: none; padding: 10px 14px 0; font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; }
.st-head .h { font-size: 13px; font-weight: 700; letter-spacing: -0.02em; color: #111827; }
.st-head .c { font-size: 9px; color: #9ca3af; margin-top: 1px; }

.st-grid {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
  padding: 9px 14px 8px;
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
}
.st-card {
  display: flex; flex-direction: column;
  border: 1px solid rgba(17, 24, 39, 0.09);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 1px 3px rgba(17, 24, 39, 0.05);
  min-height: 0;
}
.st-shot { position: relative; flex: none; height: 74px; display: grid; place-items: center; }
.st-shot svg { width: 46px; height: 46px; filter: drop-shadow(0 2px 4px rgba(17, 24, 39, 0.16)); }
.st-shot.a { background: linear-gradient(150deg, #e8eaf0 0%, #cfd4e0 100%); }
.st-shot.b { background: linear-gradient(150deg, #5b4636 0%, #2f2a2e 100%); }
.st-shot.c { background: linear-gradient(150deg, #f6c7cf 0%, #e59aa8 100%); }
.st-new {
  position: absolute; top: 5px; right: 5px;
  background: #4f46e5; color: #fff;
  font-size: 6.5px; font-weight: 700; letter-spacing: 0.06em;
  padding: 2px 5px; border-radius: 999px;
}
.st-info { padding: 7px 8px 8px; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.st-name { font-size: 9.5px; font-weight: 700; color: #111827; line-height: 1.2; }
.st-sizes { display: flex; gap: 3px; margin: 6px 0 5px; }
.st-sizes i {
  font-style: normal;
  font-size: 7px; font-weight: 500; color: #4b5563;
  background: #f3f4f6; border-radius: 4px;
  padding: 3px 0; flex: 1; text-align: center;
}
.st-sizes i.on { background: #4f46e5; color: #fff; font-weight: 700; }
.st-row { display: flex; align-items: center; gap: 5px; margin-top: auto; }
.st-price { font-size: 12px; font-weight: 700; color: #4f46e5; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.st-stock { margin-left: auto; font-size: 6.5px; font-weight: 700; color: #047857; background: #d1fae5; padding: 2px 5px; border-radius: 999px; }
.st-btn {
  margin-top: 6px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 6px 8px; border-radius: 7px;
  background: #4f46e5; color: #fff;
  font-size: 8.5px; font-weight: 700;
}
.st-btn svg { width: 9px; height: 9px; }

/* --- view 2: the payment step --- */
.st-pay {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  padding: 10px 14px 8px;
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
}
.st-steps { flex: none; display: flex; justify-content: center; gap: 7px; }
.stp {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 8.5px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px;
  background: #f3f4f6; color: #9ca3af;
}
.stp.done { background: #d1fae5; color: #047857; }
.stp.on { background: #4f46e5; color: #fff; }
.stp svg { width: 8px; height: 8px; }

.st-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 190px; gap: 12px; margin-top: 10px; }
.st-h2 { font-size: 12px; font-weight: 700; color: #111827; letter-spacing: -0.02em; }
.st-method {
  display: flex; align-items: center; gap: 8px;
  margin-top: 7px; padding: 8px 9px;
  border: 1px solid #c7d2fe; background: #eef2ff; border-radius: 9px;
}
.st-method .ic { width: 18px; height: 18px; border-radius: 5px; background: #4f46e5; display: grid; place-items: center; }
.st-method .ic svg { width: 10px; height: 10px; color: #fff; }
.st-method b { display: block; font-size: 9.5px; color: #111827; }
.st-method i { display: block; font-style: normal; font-size: 8px; color: #6b7280; margin-top: 1px; }
.st-secure { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 8px; color: #047857; }
.st-secure svg { width: 9px; height: 9px; }
.st-cta {
  margin-top: 9px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px; border-radius: 9px;
  background: #4f46e5; color: #fff;
  font-size: 11px; font-weight: 700;
  box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28);
  transition: transform 0.16s ease, background 0.2s ease;
}
/* the click, on the way into the drop-in */
.store.pressing .st-cta { transform: scale(0.975); background: #4338ca; }

.st-sum {
  border: 1px solid rgba(17, 24, 39, 0.1); border-radius: 10px;
  padding: 9px 10px; align-self: start;
  background: #fafafa;
}
.st-sum .r { display: flex; align-items: center; font-size: 8.5px; color: #6b7280; padding: 3px 0; }
.st-sum .r b { margin-left: auto; color: #374151; font-weight: 600; font-variant-numeric: tabular-nums; }
.st-sum .r.tot { border-top: 1px solid rgba(17, 24, 39, 0.1); margin-top: 4px; padding-top: 6px; font-size: 10px; color: #111827; font-weight: 700; }
.st-sum .r.tot b { color: #4f46e5; font-size: 12px; font-weight: 700; }

/* What is in the cart, on the merchant's own page rather than inside the
   Cashfree sheet. By the payment step the buyer has already agreed to the
   basket; the drop-in's job is to take the money, not to re-open the cart. */
.st-side { min-width: 0; align-self: start; }
.st-cart { margin-bottom: 8px; }
.st-cart .hd {
  display: flex; align-items: baseline;
  padding: 0 1px 5px;
  font-size: 8px; font-weight: 700; color: #6b7280;
  letter-spacing: 0.05em; text-transform: uppercase;
}
.st-cart .hd .n {
  margin-left: auto;
  font-weight: 600; letter-spacing: 0; text-transform: none;
}
.st-cline {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 8px; background: #fff;
  border: 1px solid rgba(17, 24, 39, 0.1); border-radius: 10px;
}
.st-cline + .st-cline { margin-top: 5px; }
.st-cline .pic {
  width: 30px; height: 30px; border-radius: 6px; flex: none;
  display: grid; place-items: center; background: #f3f4f6;
}
.st-cline .pic svg { width: 22px; height: 22px; }
.st-cline .tx { min-width: 0; flex: 1; }
.st-cline .tx b { display: block; font-size: 9px; font-weight: 700; color: #111827; line-height: 1.25; }
.st-cline .tx i { display: block; font-style: normal; font-size: 7.5px; color: #6b7280; margin-top: 2px; }
.st-cline .pz { font-size: 9.5px; font-weight: 700; color: #111827; font-variant-numeric: tabular-nums; }

/* --- view 3: the Cashfree drop-in --- */
.st-dim {
  position: absolute; inset: 0; background: rgba(17, 24, 39, 0.45);
  opacity: 0; transition: opacity 0.32s ease;
}
.store.cfopen .st-dim, .store.paid .st-dim { opacity: 1; }
.cf {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.97);
  /* the reference is a phone-shaped sheet, and that is how Cashfree's checkout
     arrives on a desktop site too: a narrow panel centred over the page */
  width: 292px; height: 262px;
  display: flex; flex-direction: column;
  border-radius: 12px; overflow: hidden;
  background: #fff;
  box-shadow: 0 26px 60px rgba(17, 24, 39, 0.4);
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  opacity: 0;
  transition: opacity 0.34s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
}
.store.cfopen .cf { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.store.paid .cf { opacity: 0; transform: translate(-50%, -50%) scale(0.98); pointer-events: none; }

/* --- Proceed to Pay, the way the real one behaves ---------------------------
 *
 * The real checkout does not cut from a button straight to a sheet. Pressing
 * Proceed to Pay puts up Cashfree's own looped loader while the SDK boots, then
 * the checkout lands, the method clears, and only then is it paid. Skipping
 * those two beats is what made this step feel like a screenshot instead of a
 * payment, so both are here. The loader is the real asset rather than a redraw.
 */
.cf-load {
  position: absolute; inset: 0; z-index: 6;
  background: #fdfdfd;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.store.cfload .cf-load { opacity: 1; }
.cf-load .lgif { width: 210px; height: auto; display: block; }
.cf-load .lnote { font-size: 9px; color: #9ca3af; letter-spacing: 0.01em; }

/* the moment between "pay" and "paid", which a real payment always has */
.store.paying .cf { filter: saturate(0.9); }
.store.paying .occ-pm.on { box-shadow: 0 0 0 2px rgba(0, 122, 76, 0.4); }
.cf-pay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.97);
  z-index: 7;
  display: flex; align-items: center; gap: 9px;
  padding: 11px 16px; border-radius: 12px; background: #fff;
  box-shadow: 0 22px 50px rgba(17, 24, 39, 0.38);
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  font-size: 11.5px; font-weight: 600; color: #111827;
  opacity: 0; pointer-events: none;
  transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
}
.store.paying .cf-pay { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.cf-pay .sp {
  width: 15px; height: 15px; border-radius: 50%; flex: none;
  border: 2px solid rgba(0, 122, 76, 0.16); border-top-color: #007a4c;
  animation: cfSpin 0.7s linear infinite;
}
@keyframes cfSpin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .cf-pay .sp { animation: none } }

/* --- the checkout itself, from ../Checkout Screen/OCC + AOV-1.png -----------
 *
 * Green header, the buyer's saved address, what is in the cart, what pairs with
 * it, offers, payment options, and a black Pay Now bar pinned to the bottom.
 * Everything above that bar scrolls in the real thing; here the panel simply
 * clips, which reads the same at this size.
 */
.cf { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; }
.occ-strip {
  flex: none; display: flex; align-items: center; justify-content: center; gap: 5px;
  background: #1c6b45; color: #fff;
  font-size: 7.5px; font-weight: 500; padding: 3px 0;
}
.occ-strip svg { width: 9px; height: 9px; }
.occ-head {
  flex: none; background: #0b5132; color: #fff;
  padding: 6px 9px 5px;
  display: flex; align-items: center; gap: 7px;
}
.occ-head .bk { font-size: 12px; opacity: 0.8; }
.occ-head .logo {
  width: 27px; height: 27px; border-radius: 7px; background: #fff;
  display: grid; place-items: center; flex: none;
}
.occ-head .logo svg { width: 15px; height: 15px; color: #0b5132; }
.occ-head .nm { font-size: 11.5px; font-weight: 700; letter-spacing: -0.02em; }
.occ-head .amt {
  margin-left: auto; display: flex; align-items: center; gap: 4px;
  background: rgba(255, 255, 255, 0.16); border-radius: 6px;
  padding: 4px 7px; font-size: 10px; font-weight: 700;
}
.occ-sec {
  flex: none; background: #0b5132; color: rgba(255, 255, 255, 0.82);
  font-size: 7px; padding: 0 0 5px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.occ-sec .cfl { width: 13px; height: 13px; display: inline-flex; }

.occ-body { flex: 1; min-height: 0; overflow: hidden; background: #f4f5f4; padding: 6px 7px; }
/* The reference is a phone screen; this is a 276px browser page. Rather than
   delete sections until it fits, the sheet does what the buyer does -- lands on
   the address, then glides down to the method it is about to pay with. The
   distance is measured at run time, so editing the contents cannot leave it
   landing in the wrong place. */
.occ-scroll { transition: transform 1s cubic-bezier(0.33, 1, 0.68, 1); }
@media (prefers-reduced-motion: reduce) { .occ-scroll { transition: none } }
.occ-card {
  background: #fff; border: 1px solid rgba(17, 24, 39, 0.08); border-radius: 8px;
  padding: 5px 7px; margin-bottom: 5px;
}
.occ-addr { font-size: 7.5px; line-height: 1.38; color: #374151; }
.occ-addr b { color: #111827; }
.occ-addr .con { color: #9ca3af; }
.occ-ship {
  margin-top: 4px; padding-top: 4px; border-top: 1px solid #f0f0ef;
  display: flex; align-items: center; gap: 5px; font-size: 7.5px; color: #111827;
}
.occ-ship svg { width: 11px; height: 11px; flex: none; }
.occ-ship em { font-style: normal; color: #0b8f5c; font-weight: 600; }
.occ-ship .ch { margin-left: auto; color: #9ca3af; }

.occ-items { display: flex; gap: 6px; }
.occ-item {
  flex: 1; min-width: 0; background: #fff;
  border: 1px solid rgba(17, 24, 39, 0.08); border-radius: 8px;
  padding: 6px; display: flex; gap: 6px;
}
.occ-item .pic {
  width: 34px; height: 34px; border-radius: 6px; flex: none; overflow: hidden;
  display: grid; place-items: center; background: #f6f7f6;
}
.occ-item .pic svg { width: 26px; height: 26px; }
.occ-item .tx { min-width: 0; flex: 1; }
.occ-item .nm {
  font-size: 8px; font-weight: 700; color: #111827; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.occ-item .pr { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
.occ-item .pr b { font-size: 9px; color: #111827; }
.occ-item .pr s { font-size: 7.5px; color: #9ca3af; }
.occ-item .pr i {
  font-style: normal; font-size: 6.5px; font-weight: 600; color: #0b8f5c;
  background: #e7f6ee; border-radius: 999px; padding: 1px 5px;
}
.occ-item .add {
  margin-top: 3px; display: inline-block;
  border: 1px solid #d5d7d5; border-radius: 5px;
  font-size: 7.5px; font-weight: 600; color: #111827; padding: 3px 9px;
}
.occ-lbl { display: flex; align-items: baseline; padding: 6px 2px 3px; }
.occ-lbl .l { font-size: 8px; color: #6b7280; }
.occ-lbl .r { margin-left: auto; font-size: 7.5px; font-weight: 700; color: #111827; }

/* one offer, inline, with the count of the rest -- the reference's two cards
   plus their heading in the height of a single row */
.occ-off {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(160deg, #f3fbf6 0%, #eaf7f0 100%);
  border: 1px solid rgba(0, 122, 76, 0.16); border-radius: 7px;
  padding: 5px 7px;
}
.occ-off .cd { font-size: 7.5px; font-weight: 700; color: #0b5132; }
.occ-off .ds { font-size: 7.5px; color: #374151; }
.occ-off .ap {
  margin-left: auto; border: 1px solid #0b5132; border-radius: 4px;
  font-size: 7px; font-weight: 700; color: #0b5132; padding: 2px 7px;
}

.occ-cps { display: flex; gap: 6px; }
.occ-cp {
  flex: 1; min-width: 0;
  background: linear-gradient(160deg, #f3fbf6 0%, #eaf7f0 100%);
  border: 1px solid rgba(0, 122, 76, 0.16); border-radius: 8px;
  padding: 6px 7px;
}
.occ-cp .cd { font-size: 7.5px; font-weight: 600; color: #6b7280; }
.occ-cp .ds { font-size: 8px; color: #111827; margin-top: 2px; }
.occ-cp .ap {
  float: right; border: 1px solid #0b5132; border-radius: 5px;
  font-size: 7.5px; font-weight: 700; color: #0b5132; padding: 3px 8px;
}

.occ-pm {
  display: flex; align-items: center; gap: 7px;
  background: #fff; border: 1px solid rgba(17, 24, 39, 0.1); border-radius: 8px;
  padding: 5px 7px; margin-top: 4px;
}
.occ-pm .rd {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  border: 1.5px solid #c9cbc9;
}
.occ-pm.on { border-color: #111827; }
.occ-pm.on .rd { border-color: #111827; box-shadow: inset 0 0 0 2.5px #111827; }
.occ-pm .ic {
  width: 20px; height: 20px; border-radius: 5px; flex: none;
  border: 1px solid #eceeec; display: grid; place-items: center;
}
.occ-pm .ic svg { width: 12px; height: 12px; }
.occ-pm .nm { font-size: 8.5px; font-weight: 700; color: #111827; line-height: 1.15; }
.occ-pm .nm i { display: block; font-style: normal; font-size: 6.5px; font-weight: 500; color: #9ca3af; margin-top: 1px; }
.occ-pm .vl { margin-left: auto; font-size: 9px; font-weight: 700; color: #111827; }
.occ-pm-note { font-size: 7px; color: #9ca3af; text-align: center; padding: 4px 0 0; }

.occ-bar {
  flex: none; margin: 5px 7px 6px;
  background: #111311; color: #fff; border-radius: 8px;
  padding: 6px 10px; display: flex; align-items: center;
}
.occ-bar .t { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.occ-bar .go { margin-left: auto; font-size: 11px; font-weight: 700; font-style: italic; }

.cf-done {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.96);
  width: 250px; padding: 18px 16px;
  border-radius: 13px; background: #fff;
  box-shadow: 0 26px 60px rgba(17, 24, 39, 0.34);
  text-align: center;
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  opacity: 0; pointer-events: none;
  transition: opacity 0.36s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
}
.store.paid .cf-done { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.cf-done .big {
  width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 9px;
  background: var(--evergreen); display: grid; place-items: center;
}
.cf-done .big svg { width: 17px; height: 17px; }
.cf-done .t { font-size: 13px; font-weight: 700; color: #111827; letter-spacing: -0.02em; }
.cf-done .amt { font-size: 20px; font-weight: 700; color: #111827; margin-top: 3px; font-variant-numeric: tabular-nums; }
.cf-done .sub { font-size: 8px; color: #6b7280; margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

/* the caption strip: what this beat is showing */
.st-cap {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 10px;
  border-top: 1px solid rgba(17, 24, 39, 0.08);
  background: #fbfbfc;
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  font-size: 10.5px; line-height: 1.35; color: #4b5563;
}
.st-cap .tick {
  flex: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--evergreen); display: none; place-items: center;
}
.st-cap .tick svg { width: 9px; height: 9px; }
.store.paid .st-cap { background: #f0fdf6; border-top-color: rgba(0, 173, 108, 0.28); color: #065f46; font-weight: 600; }
.store.paid .st-cap .tick { display: grid; }
.st-cap .amt { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #6b7280; white-space: nowrap; }
.store.paid .st-cap .amt { color: #047857; font-weight: 700; }

/* No viewport rules for the terminal or the store any more.
 *
 * They used to exist because the lid was fluid: below 700px it shrank, so the
 * file rail had to stack and ShirtShop had to drop two of its three products
 * to survive a ~270px-tall band. The screen is now a fixed 360 x 800 at every
 * window size, on the page and on the booth alike, so a layout keyed to how
 * big the WINDOW is would only ever be wrong. The store rules below are the
 * phone-storefront ones the booth shipped, and they are unconditional. */

@media (max-width: 980px) {
  .demo, .demo.wide { grid-template-columns: 1fr; }
  .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
  .phone-wrap { order: -1; min-height: 0; }
}

/* =====================================================================
   BOOTH -- the section as one 360x800 vertical screen
   ---------------------------------------------------------------------
   The booth is an Android Large display stood on its end, and what runs
   on it is the DEVICE, not the page that explains the device. So booth
   mode keeps `.screen` and throws the rest away: the headline, the bento,
   the step list, the controls, the dots. Everything they said is already
   said on screen, and a booth crowd reads the screen.

   Two ways in, because there are two things to look at this on:
     - the booth display, which is 360 CSS px wide, or
     - `?booth` on a laptop, to check it without one.

   NO BEZEL, and this is the same rule the Figma frames follow: a phone
   body drawn around a 360x800 frame eats ~40px a side and shrinks the
   thing it frames, so the booth would show a SMALLER design, not a
   bigger one. Figma draws the phone at Present time; a real booth
   display IS the phone.
   ===================================================================== */
body.booth {
  margin: 0; padding: 0;
  min-height: 100vh;
  display: grid; place-items: center;
  background: #0a0a0c;
  overflow: hidden;
}
body.booth .wrap { max-width: none; margin: 0; padding: 0; }

/* the page talking about itself; on a booth the screen does that */
body.booth .eyebrow,
body.booth h1,
body.booth .wrap > .sub,
body.booth .card:not(.demo),
body.booth .demo-copy,
body.booth .dots { display: none; }

body.booth .bento { margin: 0; display: block; }
body.booth .card.demo {
  display: block; padding: 0; min-height: 0;
  background: none; border: 0; border-radius: 0; box-shadow: none;
}
body.booth .phone-wrap { min-height: 0; }

/* The chassis is just the frame here. Skills still gets `.as-term` from
   setChassis(), which on the page grows the phone to hold a 360x800 screen;
   on the booth the screen IS 360x800, so the class has nothing left to do. */
body.booth .phone,
body.booth .phone.as-term {
  width: 360px; height: 800px;
  padding: 0; border-radius: 0;
  background: none; box-shadow: none;
  transition: none;
}
body.booth .phone::before,
body.booth .phone::after,
body.booth .notch { display: none; }
/* `overflow: clip` rather than the inherited `hidden`: the four level
   panels sit under `transform: scale(1.05)` while they are `.gone`, which
   overhangs 9px a side and makes `.screen` a scroll container it has no
   business being. `clip` clips without ever becoming one. */
body.booth .screen,
body.booth .phone.as-term .screen { border-radius: 0; overflow: clip; }
/* no notch to clear any more */
body.booth .ph-top { padding-top: 14px; }
body.booth .backbtn { top: 12px; }

/* The terminal needs nothing here any more. It used to carry a booth-only
   copy of the portrait layout, because the only other copy lived behind a
   `max-width: 700px` media query that `?booth` never fires. The portrait
   layout is now simply what `.screen.term` IS, so both surfaces read the
   same rule and there is nothing left to keep in sync. */

/* 800px is 100px more than the phone was ever drawn for, and on the home
   grid that landed as dead black under the third tile. The tiles take it:
   more room for the art, which is the only thing on that screen doing any
   selling. */
body.booth .home { display: flex; flex-direction: column; padding: 34px 11px 16px; }
body.booth .hgrid { flex: 1; min-height: 0; }
body.booth .hcard { flex: 1; min-height: 0; }

/*
 * Guided tour — the interaction the Checkout360 section actually uses.
 *
 * The checkout demo is not a multi-screen tap-through: a ~90% black scrim drops

 */
.tour-on .phone { z-index: 40; }
.spot {

  border-radius: 16px;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.88);

/*
 * Paper skin -- placement for the shader grounds.
 *
 * Nothing here restyles the section. Every rule either positions a layer the
 * skin script created, or gives that layer's host the stacking context the
 * layer needs; drop the script and none of it has anything to match.
 *
 * A wash paints OVER the card's own background and UNDER everything the card
 * says, which is what z-index:-1 does -- but only inside a stacking context,
 * or it would slide behind the opaque card background and vanish. `.card` is
 * position:relative with z-index:auto, so it is not one. Hence `isolation`.
 *
 * Blending is plain alpha, deliberately. The blobs these replace were opacity
 * 0.62 over near-black, and `screen` would have meant `isolation` on the hosts
 * fighting the very blend it was there to allow.
 */

.pd-on .card { isolation: isolate; }

.pd-layer {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  border-radius: inherit;
}

/* ---------------- the hero field ---------------- */

/* The field is full-bleed, so it hangs outside .wrap and everything else in
   .wrap is lifted over it. .pd-hero is positioned WITH a z-index, so it is
   already a stacking context and needs no isolation of its own. */
.pd-on .wrap { position: relative; }
.pd-on .wrap > :not(.pd-hero) { position: relative; z-index: 1; }

.pd-hero {
  position: absolute;
  top: -210px;
  left: 50%;
  transform: translateX(-50%);
  width: min(1560px, 134vw);
  height: 700px;
  z-index: 0;
  pointer-events: none;
}

/* Masked to a soft ellipse behind the headline: the field has to be gone well
   before the bento starts, or the first card sits on coloured fog. */
.pd-hero-field {
  opacity: 0.62;
  -webkit-mask-image: radial-gradient(48% 54% at 62% 42%, #000 0%, rgba(0, 0, 0, 0.5) 44%, transparent 74%);
          mask-image: radial-gradient(48% 54% at 62% 42%, #000 0%, rgba(0, 0, 0, 0.5) 44%, transparent 74%);
}

/* ---------------- the demo card ---------------- */

/* Kept far down. The phone is the subject of this card and a busy ground
   behind it would read as a second thing to look at. */
.pd-demo {
  opacity: 0.15;
  -webkit-mask-image: radial-gradient(66% 78% at 97% 100%, #000 0%, transparent 68%);
          mask-image: radial-gradient(66% 78% at 97% 100%, #000 0%, transparent 68%);
}

/* ---------------- the three wash cards ----------------
   Each mask puts the shader back where its blob used to bleed from, so the
   section's composition is the one that was signed off. */

.pd-w-a {                                  /* was .blob-a, bottom right */
  opacity: 0.8;
  -webkit-mask-image: radial-gradient(76% 88% at 100% 108%, #000 0%, rgba(0, 0, 0, 0.6) 40%, transparent 74%);
          mask-image: radial-gradient(76% 88% at 100% 108%, #000 0%, rgba(0, 0, 0, 0.6) 40%, transparent 74%);
}

.pd-w-b {                                  /* was .blob-b, top right */
  opacity: 0.5;
  -webkit-mask-image: radial-gradient(54% 76% at 100% -6%, #000 0%, rgba(0, 0, 0, 0.5) 38%, transparent 72%);
          mask-image: radial-gradient(54% 76% at 100% -6%, #000 0%, rgba(0, 0, 0, 0.5) 38%, transparent 72%);
}

.pd-w-c {                                  /* was .blob-c, bottom right */
  opacity: 0.78;
  -webkit-mask-image: radial-gradient(60% 96% at 100% 106%, #000 0%, rgba(0, 0, 0, 0.58) 42%, transparent 76%);
          mask-image: radial-gradient(60% 96% at 100% 106%, #000 0%, rgba(0, 0, 0, 0.58) 42%, transparent 76%);
}

/* ---------------- the two measured cards ----------------
   Halftone, raked in from the right so it never sits under the numeral. */

.pd-dither {
  opacity: 0.17;
  -webkit-mask-image: linear-gradient(102deg, transparent 30%, #000 100%);
          mask-image: linear-gradient(102deg, transparent 30%, #000 100%);
}

@media (max-width: 980px) {
  .pd-hero { top: -170px; height: 560px; }
}

/* ---------------- booth ----------------
   Booth mode -- and the Framer embed layer, which forces it -- throws the page
   away and keeps the device. The grounds are page furniture, so they go too:
   without this the embedded phone would sit on a shader wash it was never
   designed against, and a kiosk would run a WebGL context all day for a layer
   nobody can see. */
body.booth .pd-hero,
body.booth .pd-layer { display: none; }
